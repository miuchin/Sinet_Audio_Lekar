<script>
const htmlContent = "<div class='card hero'><div class='row' style='justify-content:space-between'><span class='badge'>SINET Tutor • HTML</span><span class='badge'>Use-case vodič v1.1</span></div><p><b>Korak-po-korak tutor</b> sa <i>1-min decision tree</i> na vrhu ✅</p><p class='no-print'>Brzi skok: koristi dugmad ispod ili pretragu.</p><div class='links no-print'><a class='btn' href='./14_USECASE_BACKUP_RESTORE_v1.0_SR.html'>💾 Backup / Restore</a><a class='btn' href='./15_USECASE_MOJ_PROTOKOL_IZ_QUEUE_v1.0_SR.html'>🧩 Moj protokol iz Queue</a><a class='btn' href='./16_USECASE_MKB_LINKER_DXINDEX_ANAMNEZA_v1.0_SR.html'>🩺 MKB Linker → Anamneza</a></div></div>\n<div class='card doc' id='docContent'>\n<h1>🧩 Use‑case tutor #2: Kreiranje “Moj protokol” iz Queue (40 min × N dana)</h1>\n<blockquote>\n<p><strong>Cilj:</strong> da korisnik od trenutne 🎵 Liste (Queue) napravi trajni, ponovljiv plan rada koji se pokreće jednim klikom i može da se koristi danima.</p>\n</blockquote>\n<hr />\n<h2>0) 1‑min decision tree (brza odluka)</h2>\n<p><strong>Imaš već složene stavke u 🎵 Listi?</strong><br />\n➡️ <strong>DA</strong> → idi na <strong>Moji protokoli → Novi → Iz Liste (Queue)</strong></p>\n<p><strong>Hoćeš dnevnu rutinu sa stabilnim trajanjem?</strong><br />\n➡️ koristi <strong>40 min</strong> po segmentu (default/preporuka)</p>\n<p><strong>Hoćeš da se ponavlja više dana?</strong><br />\n➡️ koristi <strong>Ponovi N puta</strong> (npr. 7, 14, 21)</p>\n<p><strong>Nisi siguran šta prvo:</strong><br />\n➡️ prvo napravi Queue, tek onda protokol.</p>\n<hr />\n<h2>1) Razlika između pojmova (da se korisnik ne zbuni)</h2>\n<h3>🎵 Queue / Lista</h3>\n<p>Privremena radna lista “šta puštam sada”.<br />\nDobra za eksperimentisanje i slaganje redosleda.</p>\n<h3>⭐ Favoriti</h3>\n<p>Brzi pristup pojedinačnim stavkama.<br />\nNije isto što i plan/protokol.</p>\n<h3>➕ Moji simptomi</h3>\n<p>Korisnikove lične stavke (ručno dodate / AI generisane).<br />\nSluži za proširenje baze.</p>\n<h3>🧩 Moji protokoli</h3>\n<p>Trajni, sačuvani <strong>redosled + logika ponavljanja</strong>.<br />\nOvo je pravi alat za dnevne rutine.</p>\n<blockquote>\n<p><strong>Pravilo:</strong> Ako često puštaš istu kombinaciju — prebaci je iz Queue u <strong>Moj protokol</strong>.</p>\n</blockquote>\n<hr />\n<h2>2) Priprema (pre kreiranja protokola)</h2>\n<p>Pre nego što kreneš:</p>\n<ul>\n<li>proveri da Queue nije prazna</li>\n<li>složi stavke u željenom redosledu</li>\n<li>po potrebi ukloni višak iz Liste</li>\n<li>testiraj kratko ▶ da vidiš da li redosled “ima smisla”</li>\n</ul>\n<hr />\n<h2>3) Glavni protokol: “Moj protokol iz Queue” (korak-po-korak)</h2>\n<h3>Korak A — Napravi/sredi Queue</h3>\n<ol>\n<li>Otvori <strong>📚 Katalog</strong>.</li>\n<li>Dodaj stavke u <strong>🎵 Lista</strong> (dugme “+ U listu”).</li>\n<li>Idi na <strong>🎵 Lista</strong> i proveri redosled.</li>\n<li>Ako treba, preuredi/rediguj listu.</li>\n</ol>\n<h3>Korak B — Kreiraj protokol iz Queue</h3>\n<ol start=\"5\">\n<li>Otvori <strong>🧩 Moji protokoli</strong>.</li>\n<li>Tapni <strong>➕ Novi</strong>.</li>\n<li>Izaberi <strong>🎵 Iz Liste (Queue)</strong>.</li>\n<li>Aplikacija kopira stavke iz trenutne Liste u novi protokol.</li>\n</ol>\n<h3>Korak C — Naziv i osnovna podešavanja</h3>\n<ol start=\"9\">\n<li>Upiši naziv (primeri):<ul>\n<li><code>Jutarnja rutina 40 min</code></li>\n<li><code>Veče – smirenje i san</code></li>\n<li><code>Fokus + energija (7 dana)</code></li>\n</ul>\n</li>\n<li>(Opcionalno) dodaj kratak opis ili napomenu ako polje postoji.</li>\n</ol>\n<h3>Korak D — Loop / ponavljanje (ključni deo)</h3>\n<ol start=\"11\">\n<li>Podesi <strong>trajanje po segmentu</strong>:</li>\n</ol>\n<ul>\n<li>preporuka: <strong>40 min</strong> (default u vašem sistemu)</li>\n</ul>\n<ol start=\"12\">\n<li>Uključi / podesi <strong>Ponovi N puta</strong>.</li>\n<li>Unesi <strong>N</strong> (broj ponavljanja / ciklusa / dana po planu, zavisi kako koristiš modul).</li>\n<li>Izaberi scope ponavljanja:</li>\n</ol>\n<ul>\n<li><strong>(A) Ponovi stavku/simptom/protokol segment</strong> <em>(default, “lekarski” režim)</em></li>\n<li><strong>(B) Ponovi celu Queue listu</strong> <em>(kad želiš isti ceo ciklus ispočetka)</em></li>\n</ul>\n<ol start=\"15\">\n<li>Sačuvaj (<strong>💾 Sačuvaj</strong>).</li>\n</ol>\n<h3>Korak E — Pokretanje i provera</h3>\n<ol start=\"16\">\n<li>U listi <strong>Moji protokoli</strong> pronađi novi protokol.</li>\n<li>Tapni <strong>▶ Pokreni</strong>.</li>\n<li>Proveri da prikaz pokazuje očekivano trajanje / stavke / loop logiku.</li>\n</ol>\n<hr />\n<h2>4) Polje-po-polje (praktično objašnjenje)</h2>\n<blockquote>\n<p>Nazivi mogu blago da variraju po verziji, ali logika ostaje ista.</p>\n</blockquote>\n<h3>Naziv protokola</h3>\n<ul>\n<li><strong>Šta znači:</strong> ime tvog plana</li>\n<li><strong>Dobra praksa:</strong> ime + namena + trajanje (npr. “San 40 min – 14 dana”)</li>\n<li><strong>Greška:</strong> generičko ime tipa “proba1” (kasnije se ne zna šta je)</li>\n</ul>\n<h3>Izvor: “Iz Liste (Queue)”</h3>\n<ul>\n<li><strong>Šta radi:</strong> prepisuje trenutnu Queue u protokol</li>\n<li><strong>Bitno:</strong> ako Queue menjaš kasnije, već sačuvan protokol ostaje svoj entitet (zavisno od implementacije; tretiraj ga kao snapshot)</li>\n</ul>\n<h3>Trajanje po segmentu (npr. 40 min)</h3>\n<ul>\n<li><strong>Šta znači:</strong> koliko traje jedna frekvencija/segment u protokolu</li>\n<li><strong>Prednost 40 min:</strong> stabilna rutina, lako planiranje dana</li>\n<li><strong>Greška:</strong> predugo trajanje odmah na početku (korisnik odustane)</li>\n</ul>\n<h3>Ponovi N puta</h3>\n<ul>\n<li><strong>Šta znači:</strong> koliko puta se ciklus ponavlja</li>\n<li><strong>Primeri:</strong><ul>\n<li>7 = jedna nedelja</li>\n<li>14 = dve nedelje</li>\n<li>21 = navika/rutina period</li>\n</ul>\n</li>\n</ul>\n<h3>Scope (A/B)</h3>\n<ul>\n<li><strong>A (stavka/protokol segment):</strong> ponavljanje fokusirano, često korisno za “ciljani rad”</li>\n<li><strong>B (cela Queue):</strong> kompletan ciklus se vrti u krug, korisno za set rutine</li>\n</ul>\n<hr />\n<h2>5) Preporučeni use-case scenariji</h2>\n<h3>Scenario 1 — “Plan za danas” (jednostavno)</h3>\n<ul>\n<li>Složi 3–6 stavki u Queue</li>\n<li>Napravi protokol iz Queue</li>\n<li>40 min po segmentu</li>\n<li>N = 1 (ili bez dodatnog ponavljanja)</li>\n<li>Pokreni ▶</li>\n</ul>\n<h3>Scenario 2 — “Rutina 40 min × 7 dana”</h3>\n<ul>\n<li>Složi standardnu listu</li>\n<li>Moji protokoli → Iz Liste</li>\n<li>40 min</li>\n<li>N = 7</li>\n<li>Sačuvaj pod jasnim nazivom (npr. <code>Jutro 40×7</code>)</li>\n</ul>\n<h3>Scenario 3 — “Lekarski / ciljani režim”</h3>\n<ul>\n<li>1–2 ciljane stavke u Queue</li>\n<li>Scope = <strong>A</strong> (ponavljanje stavke)</li>\n<li>N po planu koji korisnik prati</li>\n</ul>\n<hr />\n<h2>6) Tipične greške i rešenja</h2>\n<h3>❌ “Napravio sam protokol, ali je prazan”</h3>\n<p><strong>Uzrok:</strong> Queue je bila prazna.<br />\n<strong>Rešenje:</strong> prvo dodaj stavke u 🎵 Lista, pa ponovi kreiranje.</p>\n<h3>❌ “Sve traje predugo”</h3>\n<p><strong>Uzrok:</strong> previše stavki × dugo trajanje × veliki N.<br />\n<strong>Rešenje:</strong> smanji broj stavki ili N; zadrži 40 min kao standard i skrati listu.</p>\n<h3>❌ “Ne znam da li da biram A ili B”</h3>\n<p><strong>Rešenje:</strong> kreni od <strong>A (default)</strong>; B koristi tek kad želiš kompletan loop cele liste.</p>\n<h3>❌ “Na mobilnom mi je konfuzno gde je šta”</h3>\n<p><strong>Rešenje:</strong> prvo složi Queue → tek onda otvori Moji protokoli. Ne radi sve odjednom.</p>\n<hr />\n<h2>7) Kako znati da je protokol dobro napravljen (kontrola kvaliteta)</h2>\n<ul>\n<li>[ ] Naziv je jasan</li>\n<li>[ ] Queue je imala pravi redosled</li>\n<li>[ ] Trajanje po segmentu je smisleno (npr. 40 min)</li>\n<li>[ ] N nije prevelik za početak</li>\n<li>[ ] Scope (A/B) je svesno izabran</li>\n<li>[ ] Protokol se pokreće jednim klikom i radi očekivano ✅</li>\n</ul>\n<hr />\n<h2>8) Kratka verzija (za korisnika početnika)</h2>\n<p><strong>Queue = probna lista. Moj protokol = sačuvana rutina.</strong><br />\nKad nešto koristiš često, prebaci to u <strong>Moji protokoli</strong> i sačuvaj kao 40 min × N dana. ✅</p>\n\n</div>";
document.getElementById('mount').innerHTML = htmlContent;
function escRx(s){
  const chars = ['\\','.', '*','+','?','^','$','{','}','(',')','|','[',']'];
  let out = String(s);
  for (const ch of chars) out = out.split(ch).join('\\' + ch);
  return out;
}
function findInPage(){
  const q = (document.getElementById('q').value || '').trim();
  if (!q) return;
  try { window.find(q); } catch (e) {}
  highlightAll(q);
}
function clearMarks(root){
  root.querySelectorAll('mark[data-hl="1"]').forEach(m => m.replaceWith(document.createTextNode(m.textContent)));
  root.normalize();
}
function highlightAll(q){
  const root = document.getElementById('docContent'); if (!root) return;
  clearMarks(root); if (!q) return;
  let rx; try { rx = new RegExp(escRx(q), 'gi'); } catch (e) { return; }
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const node of nodes) {
    const txt = node.nodeValue || '';
    if (!txt) continue;
    rx.lastIndex = 0;
    if (!rx.test(txt)) continue;
    rx.lastIndex = 0;
    const frag = document.createDocumentFragment(); let i = 0;
    txt.replace(rx, (m, off) => {
      frag.appendChild(document.createTextNode(txt.slice(i, off)));
      const mk = document.createElement('mark'); mk.dataset.hl = '1'; mk.textContent = m; frag.appendChild(mk);
      i = off + m.length; return m;
    });
    frag.appendChild(document.createTextNode(txt.slice(i)));
    if (node.parentNode) node.parentNode.replaceChild(frag, node);
  }
}
document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') findInPage(); });
function copyText(){
  const txt = document.getElementById('docContent')?.innerText || '';
  const btn = document.getElementById('copyBtn');
  (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => {
    const old = btn.textContent; btn.textContent = '✅ Kopirano'; setTimeout(() => (btn.textContent = old), 1200);
  }).catch(() => {
    try { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); alert('Tekst kopiran.'); } catch(e) { alert('Kopiranje nije uspelo.'); }
  });
}
</script>
