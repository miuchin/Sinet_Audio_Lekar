<script>
const htmlContent = "<div class='card hero'><div class='row' style='justify-content:space-between'><span class='badge'>SINET Tutor • HTML</span><span class='badge'>Use-case vodič v1.1</span></div><p><b>Korak-po-korak tutor</b> sa <i>1-min decision tree</i> na vrhu ✅</p><p class='no-print'>Brzi skok: koristi dugmad ispod ili pretragu.</p><div class='links no-print'><a class='btn' href='./14_USECASE_BACKUP_RESTORE_v1.0_SR.html'>💾 Backup / Restore</a><a class='btn' href='./15_USECASE_MOJ_PROTOKOL_IZ_QUEUE_v1.0_SR.html'>🧩 Moj protokol iz Queue</a><a class='btn' href='./16_USECASE_MKB_LINKER_DXINDEX_ANAMNEZA_v1.0_SR.html'>🩺 MKB Linker → Anamneza</a></div></div>\n<div class='card doc' id='docContent'>\n<h1>💾 Use‑case tutor #1: Backup / Restore (šta se čuva, gde, kako vratiti)</h1>\n<blockquote>\n<p><strong>Cilj:</strong> da korisnik bez stresa sačuva svoje lične podatke iz SINET-a i vrati ih na istom ili drugom uređaju (telefon, tablet, laptop) bez gubitka rada.</p>\n</blockquote>\n<hr />\n<h2>0) 1‑min decision tree (brza odluka)</h2>\n<p><strong>Pitanje 1:</strong> Menjaš uređaj / radiš reinstall / čist cache?<br />\n➡️ <strong>DA</strong> → prvo <strong>Backup</strong>, tek onda promene.</p>\n<p><strong>Pitanje 2:</strong> Već si izgubio nešto (Favoriti, Lista, Moji simptomi)?<br />\n➡️ <strong>DA</strong> → idi na <strong>Restore</strong> iz poslednjeg backup fajla.</p>\n<p><strong>Pitanje 3:</strong> Samo želiš sigurnost?<br />\n➡️ <strong>DA</strong> → radi <strong>rutinski Backup 1× nedeljno</strong> + pre većih izmena.</p>\n<hr />\n<h2>1) Mentalni model (vrlo važno)</h2>\n<p>SINET u browser/PWA režimu većinu korisničkih podataka čuva <strong>lokalno na uređaju</strong> (local storage / IndexedDB, zavisno od modula).<br />\nTo znači:</p>\n<ul>\n<li>✅ radi brzo i offline</li>\n<li>✅ privatno je (ostaje kod korisnika)</li>\n<li>⚠️ može nestati ako se uradi <strong>Clear site data</strong>, reset browsera ili promena uređaja</li>\n</ul>\n<p>Zato je <strong>Backup</strong> obavezan deo protokola rada.</p>\n<hr />\n<h2>2) Šta se tipično čuva u Backup-u (šta korisnik dobija)</h2>\n<p>Backup fajl (JSON) je namenjen da sačuva <strong>korisnički sloj</strong> rada, npr:</p>\n<ul>\n<li>⭐ <strong>Moji favoriti</strong></li>\n<li>🎵 <strong>Queue / Lista</strong> (trenutno složene stavke)</li>\n<li>🧩 <strong>Moji protokoli</strong></li>\n<li>➕ <strong>Moji simptomi</strong> (lične/ručno kreirane stavke)</li>\n<li>⚙️ deo <strong>podešavanja</strong> (toggle, trajanja, preference)</li>\n<li>lokalne SINET/Anamneza ključeve (npr. <code>sinet_*</code>, <code>SINET_*</code>, <code>anamneza_*</code>, <code>ANAMNEZA_*</code>)</li>\n</ul>\n<h3>Šta se obično NE čuva</h3>\n<ul>\n<li>osnovni katalog koji dolazi uz aplikaciju (<code>data/...</code>) — to je deo aplikacije</li>\n<li>programski fajlovi / update aplikacije</li>\n<li>remote sadržaj van browser memorije</li>\n</ul>\n<blockquote>\n<p><strong>Napomena:</strong> tačan skup ključeva može rasti kroz verzije; zato je dobro raditi backup posle važnog rada, a ne samo povremeno.</p>\n</blockquote>\n<hr />\n<h2>3) Backup — korak po korak (tačan redosled)</h2>\n<h3>Protokol A: Ručni backup pre izmene / update-a</h3>\n<ol>\n<li>Otvori <strong>☰ Meni</strong> → <strong>⚙️ Podešavanja</strong>.</li>\n<li>Nađi sekciju <strong>Backup / Restore</strong>.</li>\n<li>Tapni <strong>💾 Backup / Izvezi</strong>.</li>\n<li>Sačekaj preuzimanje JSON fajla (npr. <code>SINET_BACKUP_2026-02-23.json</code>).</li>\n<li><strong>Odmah proveri</strong> gde je fajl završio:<ul>\n<li><strong>iPhone (Safari):</strong> Files / Downloads ili iCloud Drive</li>\n<li><strong>Android:</strong> Downloads folder (ili browser download manager)</li>\n<li><strong>Laptop/PC:</strong> Downloads</li>\n</ul>\n</li>\n<li>Premesti kopiju na sigurnu lokaciju:<ul>\n<li>iCloud Drive / Google Drive / Dropbox / USB / drugi folder</li>\n</ul>\n</li>\n<li>(Opcionalno, ali preporučeno) napravi <strong>duplu kopiju</strong> sa datumom.</li>\n</ol>\n<h3>Provera uspeha (30 sekundi)</h3>\n<ul>\n<li>Fajl postoji ✅</li>\n<li>Fajl nije 0 KB ✅</li>\n<li>Naziv ima datum/verziju ✅</li>\n</ul>\n<hr />\n<h2>4) Restore — korak po korak (tačan redosled)</h2>\n<h3>Protokol B: Povrat podataka posle brisanja / novog uređaja</h3>\n<ol>\n<li>Otvori SINET.</li>\n<li>Idi na <strong>☰ Meni</strong> → <strong>⚙️ Podešavanja</strong>.</li>\n<li>Nađi <strong>Backup / Restore</strong>.</li>\n<li>Tapni <strong>📥 Restore / Uvezi</strong>.</li>\n<li>Izaberi odgovarajući <code>SINET_BACKUP_...json</code> fajl.</li>\n<li>Sačekaj poruku o uspehu (uvoz završen ✅).</li>\n<li>Ako aplikacija traži reload/refresh — uradi ga.</li>\n<li>Proveri ključne sekcije:<ul>\n<li>⭐ Favoriti</li>\n<li>🎵 Lista / Queue</li>\n<li>🧩 Moji protokoli</li>\n<li>➕ Moji simptomi</li>\n<li>(po potrebi) Anamneza / ostali moduli</li>\n</ul>\n</li>\n</ol>\n<h3>Provera uspeha (1 minut)</h3>\n<p>Ako su se vratili <strong>najmanje Favoriti + Moji protokoli</strong>, restore je praktično uspeo. ✅</p>\n<hr />\n<h2>5) “Šta tačno da uradim?” — realni scenariji</h2>\n<h3>Scenario 1: Menjam telefon</h3>\n<ul>\n<li>Uradi Backup na starom telefonu</li>\n<li>Pošalji backup sebi (Drive / mail / kabl)</li>\n<li>Otvori SINET na novom telefonu</li>\n<li>Restore iz tog fajla</li>\n<li>Provera: Favoriti + Protokoli + Moji simptomi</li>\n</ul>\n<h3>Scenario 2: Očistio sam cache / obrisao PWA podatke</h3>\n<ul>\n<li>Ne paniči</li>\n<li>Restore iz poslednjeg backup-a</li>\n<li>Reload aplikacije</li>\n<li>Provera sekcija</li>\n</ul>\n<h3>Scenario 3: Pre velikog importa / rada u Admin alatima</h3>\n<ul>\n<li>Prvo Backup</li>\n<li>Tek onda import/linker/dedup/dx_index operacije</li>\n<li>Ako nešto pođe loše → Restore</li>\n</ul>\n<hr />\n<h2>6) Tipične greške (i rešenja)</h2>\n<h3>❌ “Ne vidim backup fajl”</h3>\n<p><strong>Uzrok:</strong> browser ga je smestio u Downloads/Files gde korisnik ne gleda.<br />\n<strong>Rešenje:</strong> otvori Files / Downloads i pretraži <code>SINET_BACKUP</code>.</p>\n<h3>❌ “Restore ne vraća ništa”</h3>\n<p><strong>Uzrok:</strong> pogrešan/stari fajl ili oštećen JSON.<br />\n<strong>Rešenje:</strong> probaj noviji backup; proveri da li fajl ima realnu veličinu.</p>\n<h3>❌ “Restore uspeo, ali ekran izgleda isto/prazno”</h3>\n<p><strong>Uzrok:</strong> UI nije osvežen ili PWA cache je zadržao staro stanje.<br />\n<strong>Rešenje:</strong> refresh stranice / zatvori pa otvori tab; po potrebi clean reload.</p>\n<h3>❌ “Imam više backup fajlova i ne znam koji je pravi”</h3>\n<p><strong>Rešenje:</strong> koristi poslednji po datumu, ili onaj napravljen neposredno pre problema.</p>\n<hr />\n<h2>7) Bezbednosne i praktične preporuke</h2>\n<ul>\n<li>Backup fajl sadrži <strong>lične radne podatke</strong> → čuvaj ga pažljivo.</li>\n<li>Ne šalji javno u grupama.</li>\n<li>Ako radiš testiranje sa više verzija, čuvaj backup-e po šemi:<ul>\n<li><code>SINET_BACKUP_pre_update_v15.7.9.x.json</code></li>\n<li><code>SINET_BACKUP_posle_importa_YYYY-MM-DD.json</code></li>\n</ul>\n</li>\n</ul>\n<hr />\n<h2>8) Mini checklist (za Help / podršku)</h2>\n<p>Ako korisnik prijavi problem, pitaj/redom proveri:</p>\n<ul>\n<li>[ ] Da li postoji backup fajl?</li>\n<li>[ ] Da li je restore urađen iz tačnog fajla?</li>\n<li>[ ] Da li je urađen reload posle restore?</li>\n<li>[ ] Da li su provereni Favoriti / Lista / Moji protokoli?</li>\n</ul>\n<hr />\n<h2>9) Kratka verzija (za korisnika početnika)</h2>\n<p><strong>Pre svake veće izmene uradi Backup. Ako nešto nestane — Restore.</strong><br />\nTo je najvažniji sigurnosni protokol u SINET-u. ✅</p>\n\n</div>";
document.getElementById('mount').innerHTML = htmlContent;
function escRx(s){
  const chars = ['\\','.', '*','+','?','^','$','{','}','(',')','|','[',']'];
  let out = String(s);
  for (const ch of chars) out = out.split(ch).join('\\' + ch);
  return out;
}
function findInPage(){
  const q = (document.getElementById('q').value || '').trim();
  if (!q) return;
  try { window.find(q); } catch (e) {}
  highlightAll(q);
}
function clearMarks(root){
  root.querySelectorAll('mark[data-hl="1"]').forEach(m => m.replaceWith(document.createTextNode(m.textContent)));
  root.normalize();
}
function highlightAll(q){
  const root = document.getElementById('docContent'); if (!root) return;
  clearMarks(root); if (!q) return;
  let rx; try { rx = new RegExp(escRx(q), 'gi'); } catch (e) { return; }
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const node of nodes) {
    const txt = node.nodeValue || '';
    if (!txt) continue;
    rx.lastIndex = 0;
    if (!rx.test(txt)) continue;
    rx.lastIndex = 0;
    const frag = document.createDocumentFragment(); let i = 0;
    txt.replace(rx, (m, off) => {
      frag.appendChild(document.createTextNode(txt.slice(i, off)));
      const mk = document.createElement('mark'); mk.dataset.hl = '1'; mk.textContent = m; frag.appendChild(mk);
      i = off + m.length; return m;
    });
    frag.appendChild(document.createTextNode(txt.slice(i)));
    if (node.parentNode) node.parentNode.replaceChild(frag, node);
  }
}
document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') findInPage(); });
function copyText(){
  const txt = document.getElementById('docContent')?.innerText || '';
  const btn = document.getElementById('copyBtn');
  (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => {
    const old = btn.textContent; btn.textContent = '✅ Kopirano'; setTimeout(() => (btn.textContent = old), 1200);
  }).catch(() => {
    try { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); alert('Tekst kopiran.'); } catch(e) { alert('Kopiranje nije uspelo.'); }
  });
}
</script>
