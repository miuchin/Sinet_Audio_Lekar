<style>

\/h1>\n<div class=\"sp\"><\/div>\n<p>Ovo je centralno mesto za <strong>praktične tutor stranice<\/strong> (use-case protokole). Cilj je da korisnik <strong>za 1 minut odluči<\/strong> koji vodič mu treba, a zatim prati korake bez nagađanja.<\/p>\n<div class=\"sp\"><\/div>\n<p><strong>Kako koristiti ovu stranicu:<\/strong><\/p>\n<ul>\n<li>Ako želiš samo da pustiš zvuk → otvori **Quick Start (3 klika)**.<\/li>\n<li>Ako želiš da sačuvaš svoje liste → otvori **Backup / Restore**.<\/li>\n<li>Ako praviš rutinu (40 min × N dana) → otvori **Moj protokol iz Queue**.<\/li>\n<li>Ako radiš katalog/diagnostiku → otvori **MKB Linker → dx_index → Anamneza**.<\/li>\n<li>Ako koristiš AI pomoć za unos → otvori **AI Upitnik → Moji simptomi → Queue → Protokol**.<\/li>\n<\/ul>\n<div class=\"sp\"><\/div>\n<h2>⏱ 1-min decision tree (gde da idem?)<\/h2>\n<div class=\"sp\"><\/div>\n<ul>\n<li>**Treba mi samo reprodukcija odmah (bez podešavanja)**<\/li>\n<li>➜ <a href=\"./09_QUICK_START_3_KLIKA_v1.0_SR.html\">Quick Start — 3 klika do reprodukcije<\/a><\/li>\n<li>**Menjao sam telefon / browser ili hoću rezervu podataka**<\/li>\n<li>➜ <a href=\"./14_USECASE_BACKUP_RESTORE_v1.0_SR.html\">Tutor #1 — Backup / Restore<\/a><\/li>\n<li>**Sastavio sam listu i hoću da je pretvorim u rutinu/protokol**<\/li>\n<li>➜ <a href=\"./15_USECASE_MOJ_PROTOKOL_IZ_QUEUE_v1.0_SR.html\">Tutor #2 — Moj protokol iz Queue (40 min × N dana)<\/a><\/li>\n<li>**Radim medicinski tok (MKB mapiranje → indeks → Anamneza)**<\/li>\n<li>➜ <a href=\"./16_USECASE_MKB_LINKER_DXINDEX_ANAMNEZA_v1.0_SR.html\">Tutor #3 — MKB Linker → dx_index → Anamneza<\/a><\/li>\n<li>**Hoću da AI predloži stavke pa da ih pretvorim u protokol**<\/li>\n<li>➜ <a href=\"./17_USECASE_AI_UPITNIK_DO_PROTOKOLA_v1.0_SR.html\">Tutor #4 — AI Upitnik → Moji simptomi → Queue → Protokol<\/a><\/li>\n<\/ul>\n<div class=\"sp\"><\/div>\n<hr>\n<div class=\"sp\"><\/div>\n<h2>📚 Preporučeni redosled za nove korisnike (stariji korisnici / početnici)<\/h2>\n<div class=\"sp\"><\/div>\n<ol>\n<li><a href=\"./09_QUICK_START_3_KLIKA_v1.0_SR.html\">Quick Start — 3 klika<\/a><\/li>\n<li><a href=\"./14_USECASE_BACKUP_RESTORE_v1.0_SR.html\">Backup / Restore<\/a><\/li>\n<li><a href=\"./15_USECASE_MOJ_PROTOKOL_IZ_QUEUE_v1.0_SR.html\">Moj protokol iz Queue<\/a><\/li>\n<li><a href=\"./17_USECASE_AI_UPITNIK_DO_PROTOKOLA_v1.0_SR.html\">AI Upitnik → Protokol<\/a><\/li>\n<\/ol>\n<div class=\"sp\"><\/div>\n<h2>✅ Napomena<\/h2>\n<div class=\"sp\"><\/div>\n<p>Svaki tutor je pisan tako da može da se prati <strong>korak-po-korak<\/strong>, sa objašnjenjem tipičnih grešaka i kratkim savetima.<\/p>\n<\/div>\n<div class=\"foot\">SINET tutor stranica • miuchins + SINET AI<\/div>\n<\/div>\n\n<\/div>"}, "docs/protokoli/00_MASTER_STEP_BY_STEP_v1.0_SR.html": {"title": "📘 Master Step-by-Step", "html": "<style>\n    :root{--bg:#f8fafc;--card:#ffffff;--border:#e2e8f0;--text:#0f172a;--muted:#475569;--blue:#2563eb;--green:#0f766e;--amber:#b45309}\n    body{font-family:Arial,sans-serif;margin:0;background:var(--bg);color:var(--text);line-height:1.6}\n    .wrap{max-width:1080px;margin:0 auto;padding:24px}\n    .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 8px 22px rgba(15,23,42,.05)}\n    h1,h2,h3{margin-top:0}\n    .muted{color:var(--muted)}\n    .badge{display:inline-block;padding:4px 10px;border-radius:999px;background:#dbeafe;font-size:12px;font-weight:700;margin-right:6px}\n    .badge.green{background:#dcfce7}\n    .badge.warn{background:#fef3c7}\n    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}\n    .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}\n    .btn{display:inline-block;padding:10px 14px;border-radius:12px;background:var(--blue);color:#fff;text-decoration:none;font-weight:700}\n    .btn.alt{background:var(--green)}\n    .btn.warn{background:var(--amber)}\n    ol,ul{padding-left:22px}\n    code{background:#eef2ff;padding:2px 6px;border-radius:6px}\n    .step{border-left:4px solid #93c5fd;padding-left:12px;margin:12px 0}\n    .note{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:12px;padding:12px}\n  <\/style><div class='doc-wrap' data-doc-title='📘 Master Step-by-Step'>\n  <div class=\"wrap\">\n    <div class=\"card\">\n      <h1>SINET Audio Lekar — MASTER STEP-BY-STEP (v1.0 SR)<\/h1>\n      <p class=\"muted\">Glavni vodič kroz aplikaciju: šta je prvo, šta je sledeće i gde ideš kada ti treba pomoć.<\/p>\n      <div class=\"btns\"><a class=\"btn\" href=\"../../SINET_DOKUMENTACIJA_INDEX_v16.0.0.78.html\">📚 Indeks dokumentacije<\/a><a class=\"btn alt\" href=\"./09_QUICK_START_3_KLIKA_v1.0_SR.html\">🚀 Quick Start<\/a><\/div>\n    <\/div>\n    <div class=\"card\"><p><span class=\"badge\">NOVO<\/span><span class=\"badge green\">MASTER STEP-BY-STEP<\/span><span class=\"badge warn\">v16.0.0.78<\/span><\/p>\n    <p>Ovo je glavni ulazni vodič za ceo SINET Audio Lekar. Napravljen je za korisnika koji želi da zna <b>šta prvo<\/b>, <b>šta posle<\/b> i <b>gde da ide kada se zbuni<\/b>.<\/p><\/div><div class=\"grid\">\n      <div class=\"card\"><h2>1) Ako želiš brzo da kreneš<\/h2><ol>\n      <li>Idi na <b>Početni ekran<\/b> i aktiviraj zvuk ako je prvi put.<\/li>\n      <li>Za odmah korišćenje otvori <b>Katalog<\/b> ili <b>Quick Start<\/b>.<\/li>\n      <li>Za lične podatke idi na <b>Anamnezu<\/b>.<\/li>\n      <li>Za nalaze idi na <b>LAB Bridge<\/b>.<\/li>\n      <li>Za praćenje stanja kroz vreme idi na <b>Zdravstveni karton<\/b>.<\/li>\n      <\/ol><\/div>\n      <div class=\"card\"><h2>2) Ako želiš vođen redosled<\/h2><ol>\n      <li><b>Anamneza<\/b> — unesi osnovni zdravstveni okvir.<\/li>\n      <li><b>Zdravstveni karton<\/b> — složi stanje po oblastima i vremenu.<\/li>\n      <li><b>LAB Bridge<\/b> — unesi konkretne laboratorije i snapshot.<\/li>\n      <li><b>Content Studio<\/b> — dopuni katalog kada treba.<\/li>\n      <li><b>Backup<\/b> — napravi sigurnosnu kopiju pre većih izmena.<\/li>\n      <\/ol><\/div>\n    <\/div><div class=\"card\"><h2>3) Glavni moduli i kada ih koristiš<\/h2>\n    <div class=\"step\"><b>Katalog<\/b> — kada tražiš simptom, frekvenciju ili gotovu terapiju.<\/div>\n    <div class=\"step\"><b>Lista / Queue<\/b> — kada želiš da složiš više stavki za reprodukciju.<\/div>\n    <div class=\"step\"><b>Moji simptomi<\/b> — kada praviš lične ili AI-dopunjene stavke.<\/div>\n    <div class=\"step\"><b>Anamneza<\/b> — kada želiš osnovni zdravstveni kontekst i SINET predloge.<\/div>\n    <div class=\"step\"><b>Zdravstveni karton<\/b> — kada želiš pregled kroz vreme, terapije i dokumente.<\/div>\n    <div class=\"step\"><b>LAB Bridge<\/b> — kada unosiš laboratorijske nalaze i snapshot.<\/div>\n    <div class=\"step\"><b>Content Studio<\/b> — kada dopunjuješ katalog bez duplikata.<\/div>\n    <\/div><div class=\"grid\">\n      <div class=\"card\"><h2>4) Osnovna pravila snalaženja<\/h2><ul>\n      <li><b>POČETAK<\/b> te vraća na glavni početni tok.<\/li>\n      <li><b>NAZAD<\/b> te vraća na prethodni ekran i prethodni kontekst kada je moguće.<\/li>\n      <li><b>Glavni meni<\/b> prikazuje kartice.<\/li>\n      <li><b>Hamburger meni<\/b> prikazuje listu istog redosleda.<\/li>\n      <li>Ako neki Help dokument ne radi direktno, otvori <b>Indeks dokumentacije<\/b>.<\/li>\n      <\/ul><\/div>\n      <div class=\"card\"><h2>5) Kada se zbuniš<\/h2><ul>\n      <li>Otvori <b>Quick Start<\/b> za najbrži put.<\/li>\n      <li>Otvori <b>Master Step-by-Step<\/b> za kompletan pregled.<\/li>\n      <li>Otvori poseban vodič za modul koji koristiš.<\/li>\n      <li>Pre rizičnih akcija prvo uradi <b>Backup<\/b>.<\/li>\n      <\/ul><\/div>\n    <\/div><div class=\"card\"><h2>6) Sledeći najbolji klikovi<\/h2>\n    <div class=\"btns\">\n      <a class=\"btn\" href=\"./09_QUICK_START_3_KLIKA_v1.0_SR.html\">🚀 Quick Start<\/a>\n      <a class=\"btn alt\" href=\"./02_ANAMNEZA_STEP_BY_STEP_v1.0_SR.html\">🩺 Anamneza Step-by-Step<\/a>\n      <a class=\"btn\" href=\"./35_ZDRAVSTVENI_KARTON_STEP_BY_STEP_v1.0_SR.html\">🗂 Karton Step-by-Step<\/a>\n      <a class=\"btn alt\" href=\"./34_LAB_BRIDGE_STEP_BY_STEP_v1.0_SR.html\">🧪 LAB Bridge Step-by-Step<\/a>\n      <a class=\"btn warn\" href=\"./39_CONTENT_STUDIO_PROMPT_PIPELINE_STEP_BY_STEP_v1.0_SR.html\">🧠 Content Studio Step-by-Step<\/a>\n    <\/div>\n    <\/div>\n  <\/div>\n  \n<\/div>"}, "docs/protokoli/02_ANAMNEZA_STEP_BY_STEP_v1.0_SR.html": {"title": "🩺 Anamneza step-by-step", "html": "<style>\n    :root{--bg:#f8fafc;--card:#ffffff;--border:#e2e8f0;--text:#0f172a;--muted:#475569;--blue:#2563eb;--green:#0f766e;--amber:#b45309}\n    body{font-family:Arial,sans-serif;margin:0;background:var(--bg);color:var(--text);line-height:1.6}\n    .wrap{max-width:1080px;margin:0 auto;padding:24px}\n    .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 8px 22px rgba(15,23,42,.05)}\n    h1,h2,h3{margin-top:0}\n    .muted{color:var(--muted)}\n    .badge{display:inline-block;padding:4px 10px;border-radius:999px;background:#dbeafe;font-size:12px;font-weight:700;margin-right:6px}\n    .badge.green{background:#dcfce7}\n    .badge.warn{background:#fef3c7}\n    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}\n    .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}\n    .btn{display:inline-block;padding:10px 14px;border-radius:12px;background:var(--blue);color:#fff;text-decoration:none;font-weight:700}\n    .btn.alt{background:var(--green)}\n    .btn.warn{background:var(--amber)}\n    ol,ul{padding-left:22px}\n    code{background:#eef2ff;padding:2px 6px;border-radius:6px}\n    .step{border-left:4px solid #93c5fd;padding-left:12px;margin:12px 0}\n    .note{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:12px;padding:12px}\n  <\/style><div class='doc-wrap' data-doc-title='🩺 Anamneza step-by-step'>\n  <div class=\"wrap\">\n    <div class=\"card\">\n      <h1>SINET — Anamneza Step-by-Step (v1.0 SR)<\/h1>\n      <p class=\"muted\">Vođeni unos osnovnog zdravstvenog okvira, važnih događaja, terapija i polaznog SINET konteksta.<\/p>\n      <div class=\"btns\"><a class=\"btn\" href=\"./00_MASTER_STEP_BY_STEP_v1.0_SR.html\">📘 Master Step-by-Step<\/a><\/div>\n    <\/div>\n    <div class=\"card\"><p><span class=\"badge\">STEP-BY-STEP<\/span><span class=\"badge green\">NOVO<\/span><\/p>\n        <p><b>Šta je ovo:<\/b> Vođeni unos osnovnog zdravstvenog okvira, važnih događaja, terapija i polaznog SINET konteksta.<\/p><\/div><div class=\"card\"><h2>Koraci 1–2–3–4<\/h2><ol><li>Otvori <b>Anamneza<\/b> i prvo unesi osnovne podatke koje već znaš: glavne tegobe, dijagnoze, terapije i važne događaje.<\/li><li>Ako imaš MKB-10 šifru, iskoristi je kao orijentir; ako nemaš, počni od simptoma i običnog opisa.<\/li><li>Unesi najvažnije hronične probleme, alergije, operacije i hospitalizacije — ne mora sve iz prve.<\/li><li>Sačuvaj stanje i posle toga pređi na <b>Zdravstveni karton<\/b> za pregled kroz vreme, ili na <b>LAB Bridge<\/b> ako imaš laboratorije.<\/li><\/ol><\/div><div class=\"card\"><h2>Tipične zabune<\/h2>\n        <ul>\n          <li>Ne moraš sve uneti odjednom — kreni od najvažnijih podataka.<\/li>\n          <li>Ako nisi siguran gde nešto pripada, prvo ga zapiši u osnovni modul pa tek onda doteruj.<\/li>\n          <li>Pre većih izmena i importa uradi backup.<\/li>\n        <\/ul><\/div><div class=\"card\"><h2>Šta dalje posle ovog modula<\/h2><div class=\"btns\"><a class=\"btn\" href=\"./35_ZDRAVSTVENI_KARTON_STEP_BY_STEP_v1.0_SR.html\">🗂 Zdravstveni karton<\/a><a class=\"btn\" href=\"./34_LAB_BRIDGE_STEP_BY_STEP_v1.0_SR.html\">🧪 LAB Bridge<\/a><\/div><\/div>\n  <\/div>\n  \n<\/div>"}, "docs/protokoli/09_QUICK_START_3_KLIKA_v1.0_SR.html": {"title": "🚀 Quick Start (3 klika)", "html": "<style>\n:root{--bg:#f7f5f1;--card:#fff;--ink:#2c231b;--muted:#6d5f52;--accent:#7a5233;--line:#e4d8c8;--chip:#efe2cf;}\n*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;line-height:1.45}\n.header{position:sticky;top:0;z-index:10;background:rgba(247,245,241,.95);backdrop-filter: blur(6px);border-bottom:1px solid var(--line)}\n.wrap{max-width:920px;margin:0 auto;padding:14px}\n.actions{display:flex;gap:8px;flex-wrap:wrap}\n.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border-radius:999px;border:1px solid #6c4a30;background:#7a5233;color:#fff;font-weight:700;text-decoration:none;cursor:pointer}\n.btn.light{background:#fff;color:#4b3828;border-color:#d7c4ad}\n.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 2px 10px rgba(60,40,20,.06)}\n.hint{background:var(--chip);border-radius:14px;padding:10px 12px;font-weight:700;display:inline-block;margin-top:8px}\n h1,h2,h3{line-height:1.2;margin:14px 0 10px} h1{font-size:1.6rem} h2{font-size:1.2rem} h3{font-size:1.05rem}\n p{margin:8px 0;color:var(--ink)} .muted{color:var(--muted)} ul,ol{margin:6px 0 10px 22px;padding:0} li{margin:4px 0} code{background:#f2eadf;padding:1px 5px;border-radius:6px} hr{border:0;border-top:1px solid var(--line);margin:16px 0}\n .grid{display:grid;gap:12px} @media (min-width:760px){.grid.two{grid-template-columns:1fr 1fr;}}\n .sp{height:2px} .k{font-weight:700;color:#533a24} .foot{font-size:.92rem;color:var(--muted);text-align:center;padding:20px 0 28px}\n a{color:#7a5233}\n .tree li{margin-bottom:8px}\n<\/style><div class='doc-wrap' data-doc-title='🚀 Quick Start (3 klika)'>\n<div class=\"header\"><div class=\"wrap\"><div class=\"actions\">\n<a class=\"btn\" href=\"#\" onclick=\"if(window.parent&&window.parent.app&&window.parent.app.closeDocModal){window.parent.app.closeDocModal();return false;} history.back(); return false;\">← Nazad<\/a>\n<a class=\"btn light\" href=\"./00_TUTOR_VODICI_INDEX_v1.0_SR.html\">🎓 Tutor indeks<\/a>\n<a class=\"btn light\" href=\"../../SINET_User_Manual_v1.1_SR.html\">📘 Uputstvo<\/a>\n<\/div><\/div><\/div>\n<div class=\"wrap\">\n<div class=\"card\">\n<h1>🚀 Quick Start (3 klika do reprodukcije)<\/h1>\n<div class=\"sp\"><\/div>\n<p>Ovaj mini tutor je za korisnike koji žele da <strong>što brže puste zvuk<\/strong> — bez ulaska u napredne opcije.<\/p>\n<div class=\"sp\"><\/div>\n<h2>⏱ 1-min decision tree<\/h2>\n<div class=\"sp\"><\/div>\n<ul>\n<li>**Hoću odmah da pustim nešto gotovo** ➜ koristi **⚡ Brze linkove / Prvu pomoć**<\/li>\n<li>**Hoću da biram simptom iz kataloga** ➜ idi na **Katalog**<\/li>\n<li>**Hoću svoju listu/protokol** ➜ preskoči na <a href=\"./15_USECASE_MOJ_PROTOKOL_IZ_QUEUE_v1.0_SR.html\">Tutor #2<\/a><\/li>\n<\/ul>\n<div class=\"sp\"><\/div>\n<hr>\n<div class=\"sp\"><\/div>\n<h2>✅ 3 klika (najkraći put)<\/h2>\n<div class=\"sp\"><\/div>\n<ol>\n<li>Klikni **⚡ Brzo** (ili na početnoj stranici **Brzi linkovi / Prva pomoć**).<\/li>\n<li>Izaberi jednu karticu simptoma / pomoćnog seta.<\/li>\n<li>Klikni **▶ Pusti frekvencije**.<\/li>\n<\/ol>\n<div class=\"sp\"><\/div>\n<p>To je to — reprodukcija kreće. 🎧<\/p>\n<div class=\"sp\"><\/div>\n<h2>Alternativa (preko Kataloga)<\/h2>\n<div class=\"sp\"><\/div>\n<ol>\n<li>Klikni **Katalog**<\/li>\n<li>Pretraži ili otvori oblast<\/li>\n<li>Klikni **+ U listu** na željeni simptom<\/li>\n<li>Otvori **🎵 Lista / Queue**<\/li>\n<li>Klikni **▶ Pusti frekvencije**<\/li>\n<\/ol>\n<div class=\"sp\"><\/div>\n<h2>Šta znače glavne komande u playeru<\/h2>\n<div class=\"sp\"><\/div>\n<ul>\n<li>**▶ Pusti frekvencije** — start reprodukcije svih čekiranih frekvencija<\/li>\n<li>**⏸ Pauza** — pauzira trenutni tok<\/li>\n<li>**⏹ Stop** — prekida reprodukciju i resetuje tok<\/li>\n<li>**🔁 LOOP (Ponavljanje)** — ponavlja sekvencu po izboru<\/li>\n<\/ul>\n<div class=\"sp\"><\/div>\n<h2>Tipične greške (i rešenja)<\/h2>\n<div class=\"sp\"><\/div>\n<ul>\n<li>**Ne čujem zvuk**<\/li>\n<li>Proveri jačinu zvuka na telefonu<\/li>\n<li>Proveri Bluetooth/slušalice<\/li>\n<li>Klikni **🔊 AKTIVIRAJ** pa ponovo **▶**<\/li>\n<li>**Na telefonu ne vidim dovoljno prostora**<\/li>\n<li>Zatvori meni (hamburger)<\/li>\n<li>Skroluj naniže do player panela<\/li>\n<li>**Otvara se pretraga i tastatura odmah**<\/li>\n<li>Tapni van polja za pretragu ili zatvori tastaturu (strelica / back)<\/li>\n<li>Nastavi skrol do kartica / playera<\/li>\n<\/ul>\n<div class=\"sp\"><\/div>\n<h2>Savet za starije korisnike ❤️<\/h2>\n<div class=\"sp\"><\/div>\n<p>Za prvi kontakt koristite <strong>⚡ Brze linkove<\/strong>, jer su to već pripremljeni setovi i najmanje su zbunjujući.<\/p>\n<\/div>\n<div class=\"foot\">SINET tutor stranica • miuchins + SINET AI<\/div>\n<\/div>\n\n<\/div>"}, "docs/protokoli/15_USECASE_MOJ_PROTOKOL_IZ_QUEUE_v1.0_SR.html": {"title": "🧩 Moj protokol iz Queue", "html": "<style>:root{--bg:#f7fafc;--card:#fff;--ink:#0f172a;--line:#dbe6f4}\n*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}\nbody{padding:12px}.wrap{max-width:980px;margin:0 auto}.topbar{position:sticky;top:0;z-index:20;background:rgba(247,250,252,.95);backdrop-filter:blur(6px);padding:8px 0 10px;border-bottom:1px solid var(--line);margin-bottom:12px}\n.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.btn,.search{border:1px solid #c7d8ef;border-radius:12px;background:#fff;min-height:40px}.btn{padding:0 12px;font-weight:700;color:#1e3a5f;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn:hover{background:#f1f7ff}.search{padding:0 12px;min-width:220px;flex:1;color:#111}\n.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 2px 12px rgba(15,23,42,.04);margin-bottom:12px}.hero{background:linear-gradient(180deg,#eff6ff,#ffffff)}.hero p{margin:.35rem 0;color:#24476b}.badge{display:inline-block;background:#eaf2ff;border:1px solid #c7dbff;color:#1d4ed8;border-radius:999px;padding:4px 10px;font-weight:700;font-size raži ovaj tutor...\" />\n      <button class=\"btn\" type=\"button\" onclick=\"findInPage()\">Nađi<\/button>\n    <\/div>\n  <\/div>\n  <div id=\"mount\"><\/div>\n  <div class=\"footer\">Ko-autorstvo: miuchins (Svetozar Miuchin) + SINET AI<\/div>\n<\/div>\n\n<\/div>"}, "docs/protokoli/34_LAB_BRIDGE_STEP_BY_STEP_v1.0_SR.html": {"title": "🧪 LAB bridge step-by-step", "html": "<style>\n    :root{--bg:#f8fafc;--card:#ffffff;--border:#e2e8f0;--text:#0f172a;--muted:#475569;--blue:#2563eb;--green:#0f766e;--amber:#b45309}\n    body{font-family:Arial,sans-serif;margin:0;background:var(--bg);color:var(--text);line-height:1.6}\n    .wrap{max-width:1080px;margin:0 auto;padding:24px}\n    .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 8px 22px rgba(15,23,42,.05)}\n    h1,h2,h3{margin-top:0}\n    .muted{color:var(--muted)}\n    .badge{display:inline-block;padding:4px 10px;border-radius:999px;background:#dbeafe;font-size:12px;font-weight:700;margin-right:6px}\n    .badge.green{background:#dcfce7}\n    .badge.warn{background:#fef3c7}\n    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}\n    .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}\n    .btn{display:inline-block;padding:10px 14px;border-radius:12px;background:var(--blue);color:#fff;text-decoration:none;font-weight:700}\n    .btn.alt{background:var(--green)}\n    .btn.warn{background:var(--amber)}\n    ol,ul{padding-left:22px}\n    code{background:#eef2ff;padding:2px 6px;border-radius:6px}\n    .step{border-left:4px solid #93c5fd;padding-left:12px;margin:12px 0}\n    .note{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:12px;padding:12px}\n  <\/style><div class='doc-wrap' data-doc-title='🧪 LAB bridge step-by-step'>\n  <div class=\"wrap\">\n    <div class=\"card\">\n      <h1>SINET — LAB Bridge Step-by-Step (v1.0 SR)<\/h1>\n      <p class=\"muted\">Vođeni unos laboratorijskih nalaza i pravljenje Lab Snapshot pregleda za dalji rad.<\/p>\n      <div class=\"btns\"><a class=\"btn\" href=\"./00_MASTER_STEP_BY_STEP_v1.0_SR.html\">📘 Master Step-by-Step<\/a><\/div>\n    <\/div>\n    <div class=\"card\"><p><span class=\"badge\">STEP-BY-STEP<\/span><span class=\"badge green\">NOVO<\/span><\/p>\n        <p><b>Šta je ovo:<\/b> Vođeni unos laboratorijskih nalaza i pravljenje Lab Snapshot pregleda za dalji rad.<\/p><\/div><div class=\"card\"><h2>Koraci 1–2–3–4<\/h2><ol><li>Pripremi laboratorijske nalaze koje želiš da uneseš — pojedinačne rezultate, referentne vrednosti i datum.<\/li><li>U <b>LAB Bridge<\/b> unesi nalaze pregledno, po mogućnosti grupisano po analizi ili terminu.<\/li><li>Napravi <b>Lab Snapshot<\/b> da dobiješ sažet pregled trenutnog laboratorijskog stanja.<\/li><li>Zatim poveži nalaz sa <b>Zdravstvenim kartonom<\/b> i širim kontekstom iz <b>Anamneze<\/b>.<\/li><\/ol><\/div><div class=\"card\"><h2>Tipične zabune<\/h2>\n        <ul>\n          <li>Ne moraš sve uneti odjednom — kreni od najvažnijih podataka.<\/li>\n          <li>Ako nisi siguran gde nešto pripada, prvo ga zapiši u osnovni modul pa tek onda doteruj.<\/li>\n          <li>Pre većih izmena i importa uradi backup.<\/li>\n        <\/ul><\/div><div class=\"card\"><h2>Šta dalje posle ovog modula<\/h2><div class=\"btns\"><a class=\"btn\" href=\"./35_ZDRAVSTVENI_KARTON_STEP_BY_STEP_v1.0_SR.html\">🗂 Zdravstveni karton<\/a><a class=\"btn\" href=\"./02_ANAMNEZA_STEP_BY_STEP_v1.0_SR.html\">🩺 Anamneza<\/a><\/div><\/div>\n  <\/div>\n  \n<\/div>"}, "docs/protokoli/35_ZDRAVSTVENI_KARTON_STEP_BY_STEP_v1.0_SR.html": {"title": "📋 Zdravstveni karton step-by-step", "html": "<style>\n    :root{--bg:#f8fafc;--card:#ffffff;--border:#e2e8f0;--text:#0f172a;--muted:#475569;--blue:#2563eb;--green:#0f766e;--amber:#b45309}\n    body{font-family:Arial,sans-serif;margin:0;background:var(--bg);color:var(--text);line-height:1.6}\n    .wrap{max-width:1080px;margin:0 auto;padding:24px}\n    .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 8px 22px rgba(15,23,42,.05)}\n    h1,h2,h3{margin-top:0}\n    .muted{color:var(--muted)}\n    .badge{display:inline-block;padding:4px 10px;border-radius:999px;background:#dbeafe;font-size:12px;font-weight:700;margin-right:6px}\n    .badge.green{background:#dcfce7}\n    .badge.warn{background:#fef3c7}\n    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}\n    .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}\n    .btn{display:inline-block;padding:10px 14px;border-radius:12px;background:var(--blue);color:#fff;text-decoration:none;font-weight:700}\n    .btn.alt{background:var(--green)}\n    .btn.warn{background:var(--amber)}\n    ol,ul{padding-left:22px}\n    code{background:#eef2ff;padding:2px 6px;border-radius:6px}\n    .step{border-left:4px solid #93c5fd;padding-left:12px;margin:12px 0}\n    .note{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:12px;padding:12px}\n  <\/style><div class='doc-wrap' data-doc-title='📋 Zdravstveni karton step-by-step'>\n  <div class=\"wrap\">\n    <div class=\"card\">\n      <h1>SINET — Zdravstveni karton Step-by-Step (v1.0 SR)<\/h1>\n      <p class=\"muted\">Pregled stanja kroz vreme: dijagnoze, terapije, kontrole, trendovi i dokumenti po oblastima.<\/p>\n      <div class=\"btns\"><a class=\"btn\" href=\"./00_MASTER_STEP_BY_STEP_v1.0_SR.html\">📘 Master Step-by-Step<\/a><\/div>\n    <\/div>\n    <div class=\"card\"><p><span class=\"badge\">STEP-BY-STEP<\/span><span class=\"badge green\">NOVO<\/span><\/p>\n        <p><b>Šta je ovo:<\/b> Pregled stanja kroz vreme: dijagnoze, terapije, kontrole, trendovi i dokumenti po oblastima.<\/p><\/div><div class=\"card\"><h2>Koraci 1–2–3–4<\/h2><ol><li>Posle Anamneze otvori <b>Zdravstveni karton<\/b> da složiš stanje po oblastima i vremenskim periodima.<\/li><li>Unesi ili dopuni glavne dijagnoze, kontrole, promene terapije i važne napomene specijalista.<\/li><li>Koristi Karton kao centralni pregled: šta je bilo ranije, šta je sada aktivno i šta treba pratiti.<\/li><li>Ako imaš sveže laboratorije, pređi na <b>LAB Bridge<\/b>; ako treba opšti kontekst, vrati se na <b>Anamnezu<\/b>.<\/li><\/ol><\/div><div class=\"card\"><h2>Tipične zabune<\/h2>\n        <ul>\n          <li>Ne moraš sve uneti odjednom — kreni od najvažnijih podataka.<\/li>\n          <li>Ako nisi siguran gde nešto pripada, prvo ga zapiši u osnovni modul pa tek onda doteruj.<\/li>\n          <li>Pre većih izmena i importa uradi backup.<\/li>\n        <\/ul><\/div><div class=\"card\"><h2>Šta dalje posle ovog modula<\/h2><div class=\"btns\"><a class=\"btn\" href=\"./34_LAB_BRIDGE_STEP_BY_STEP_v1.0_SR.html\">🧪 LAB Bridge<\/a><a class=\"btn\" href=\"./02_ANAMNEZA_STEP_BY_STEP_v1.0_SR.html\">🩺 Anamneza<\/a><\/div><\/div>\n  <\/div>\n  \n<\/div>"}, "docs/protokoli/37_SINET_CONTROL_CENTER_INSTALL_v1.0_SR.html": {"title": "🎛 Control Center + Install", "html": "<style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;max-width:900px;margin:0 auto;padding:18px;line-height:1.6;background:#f7fbff;color:#223}h1,h2{color:#0f3d66}code,pre{background:#eef4fb;border-radius:10px}code{padding:.15em .4em}pre{padding:12px;overflow:auto}.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 4px 18px rgba(15,23,42,.08);margin:0 0 16px}.btn{display:inline-block;background:#2563eb;color:#fff;text-decoration:none;padding:11px 14px;border-radius:12px;font-weight:700;margin-right:8px;margin-bottom:8px}<\/style><div class='doc-wrap' data-doc-title='🎛 Control Center + Install'><div class='card'><h1>🎛 SINET Control Center + Install<\/h1><p><b>Control Center je odvojen od Audio Lekara.<\/b> Po planu služi za <b>instalacije za korisnika<\/b>, desktop launcher, lokalni start, backup i GitHub/Netlify tokove.<\/p><p>Zato ga ne vidiš kao terapijski ekran unutar aplikacije. U Audio Lekaru postoji <b>dokumentacioni ulaz<\/b>, a sam alat je u folderu <code>tools/control-center/<\/code>.<\/p><p><a class='btn' href='../control-center/SINET_Control_Center_v1.html'>Otvori Control Center vodič<\/a><a class='btn' href='../../tools/control-center/README_SINET_CONTROL_CENTER_v1.md'>README<\/a><\/p><\/div><div class='card'><h2>Brza instalacija na Manjaru<\/h2><pre>chmod +x tools/control-center/*.sh\nchmod +x tools/control-center/*.desktop\n./tools/control-center/install_sinet_control_center.sh<\/pre><p>Installer pravi <code>~/Desktop/SINET_Control_Center<\/code> i kopira sve potrebne fajlove.<\/p><\/div><div class='card'><h2>Glavni fajlovi<\/h2><ul><li><code>sinet_control_center_manjaro.sh<\/code><\/li><li><code>sinet_control_center.desktop<\/code><\/li><li><code>install_sinet_control_center.sh<\/code><\/li><li><code>projects.json<\/code><\/li><\/ul><\/div><\/div>"}, "docs/protokoli/38_INSTALLACIJA_ZA_KORISNIKA_ONE_CLICK_v1.0_SR.html": {"title": "⬇️ Instalacija za korisnika", "html": "<style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;line-height:1.65;max-width:900px;margin:0 auto;padding:18px;background:#f8fbff;color:#1f2937}h1,h2{color:#0f3d66}.card{background:#fff;border:1px solid #dbeafe;border-radius:16px;padding:16px;margin:0 0 16px;box-shadow:0 4px 18px rgba(15,23,42,.06)}ul{padding-left:20px}<\/style><div class='doc-wrap' data-doc-title='⬇️ Instalacija za korisnika'><div class=\"card\"><h1>⬇️ Instalacija za korisnika (1 klik)<\/h1><p>Poseban Install paket vodi korisnika kroz instalaciju jednim klikom — bez ulaska u terminal i bez CMD koraka.<\/p><\/div><div class=\"card\"><h2>Šta installer radi<\/h2><ul><li>raspakuje aplikaciju<\/li><li>pravi desktop prečice<\/li><li>pokreće lokalni server<\/li><li>otvara aplikaciju u browseru<\/li><li>instalira i spoljašnji SINET Control Center<\/li><\/ul><\/div><\/div>"}, "docs/protokoli/39_CONTENT_STUDIO_PROMPT_PIPELINE_STEP_BY_STEP_v1.0_SR.html": {"title": "🧠 Content Studio pipeline", "html": "<style>\n    :root{--bg:#f8fafc;--card:#ffffff;--border:#e2e8f0;--text:#0f172a;--muted:#475569;--blue:#2563eb;--green:#0f766e;--amber:#b45309}\n    body{font-family:Arial,sans-serif;margin:0;background:var(--bg);color:var(--text);line-height:1.6}\n    .wrap{max-width:1080px;margin:0 auto;padding:24px}\n    .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 8px 22px rgba(15,23,42,.05)}\n    h1,h2,h3{margin-top:0}\n    .muted{color:var(--muted)}\n    .badge{display:inline-block;padding:4px 10px;border-radius:999px;background:#dbeafe;font-size:12px;font-weight:700;margin-right:6px}\n    .badge.green{background:#dcfce7}\n    .badge.warn{background:#fef3c7}\n    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}\n    .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}\n    .btn{display:inline-block;padding:10px 14px;border-radius:12px;background:var(--blue);color:#fff;text-decoration:none;font-weight:700}\n    .btn.alt{background:var(--green)}\n    .btn.warn{background:var(--amber)}\n    ol,ul{padding-left:22px}\n    code{background:#eef2ff;padding:2px 6px;border-radius:6px}\n    .step{border-left:4px solid #93c5fd;padding-left:12px;margin:12px 0}\n    .note{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:12px;padding:12px}\n  <\/style><div class='doc-wrap' data-doc-title='🧠 Content Studio pipeline'>\n  <div class=\"wrap\">\n    <div class=\"card\">\n      <h1>SINET — Content Studio Prompt Pipeline Step-by-Step (v1.0 SR)<\/h1>\n      <p class=\"muted\">Vođeni tok za dopunu kataloga: seed iz postojećeg kataloga, prompt, preview/dedupe i bezbedan import.<\/p>\n      <div class=\"btns\"><a class=\"btn\" href=\"./00_MASTER_STEP_BY_STEP_v1.0_SR.html\">📘 Master Step-by-Step<\/a><\/div>\n    <\/div>\n    <div class=\"card\"><p><span class=\"badge\">STEP-BY-STEP<\/span><span class=\"badge green\">NOVO<\/span><\/p>\n        <p><b>Šta je ovo:<\/b> Vođeni tok za dopunu kataloga: seed iz postojećeg kataloga, prompt, preview/dedupe i bezbedan import.<\/p><\/div><div class=\"card\"><h2>Koraci 1–2–3–4<\/h2><ol><li>U Content Studio upiši oblast ili temu i proveri <b>seed panel<\/b>: on pokazuje šta već postoji u Katalogu i Mojim simptomima.<\/li><li>Klikni <b>Prompt 1×100 + seed<\/b> kada radiš jednu sesiju, ili <b>Prompt 10×100 + seed<\/b> kada radiš veći batch.<\/li><li>AI rezultat nalepi kao NDJSON/JSONL, pa uradi <b>Preview / Dedupe<\/b> da vidiš šta je novo a šta duplikat.<\/li><li>Tek posle pregleda klikni <b>Validiraj + Dodaj u katalog<\/b>, pa po potrebi uradi <b>Export patch<\/b>.<\/li><\/ol><\/div><div class=\"card\"><h2>Tipične zabune<\/h2>\n        <ul>\n          <li>Ne moraš sve uneti odjednom — kreni od najvažnijih podataka.<\/li>\n          <li>Ako nisi siguran gde nešto pripada, prvo ga zapiši u osnovni modul pa tek onda doteruj.<\/li>\n          <li>Pre većih izmena i importa uradi backup.<\/li>\n        <\/ul><\/div><div class=\"card\"><h2>Šta dalje posle ovog modula<\/h2><div class=\"btns\"><a class=\"btn\" href=\"./00_MASTER_STEP_BY_STEP_v1.0_SR.html\">📘 Master Step-by-Step<\/a><a class=\"btn\" href=\"../../SINET_DOKUMENTACIJA_INDEX_v16.0.0.78.html\">📚 Indeks dokumentacije<\/a><\/div><\/div>\n  <\/div>\n  \n<\/div>"}, "docs/protokoli/40_MEDICAL_WORKFLOW_ANAMNEZA_KARTON_LAB_v1.0_SR.html": {"title": "🧭 Medical workflow", "html": "<style>\n    :root{--bg:#f8fafc;--card:#fff;--border:#e2e8f0;--text:#0f172a;--muted:#475569;--blue:#2563eb;--green:#0f766e;--amber:#b45309}\n    body{font-family:Arial,sans-serif;background:var(--bg);color:var(--text);margin:0;line-height:1.65}\n    .wrap{max-width:980px;margin:0 auto;padding:24px}\n    .card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 8px 24px rgba(15,23,42,.05)}\n    h1,h2,h3{margin-top:0}.muted{color:var(--muted)}\n    .badge{display:inline-block;padding:4px 10px;border-radius:999px;background:#dbeafe;font-size:12px;font-weight:700;margin-right:6px}\n    .grid{display:grid;gap:14px}.grid.two{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}\n    .step{padding:14px;border-left:4px solid #93c5fd;background:#f8fbff;border-radius:12px;margin:10px 0}\n    ul,ol{padding-left:22px} code{background:#eef2ff;padding:2px 6px;border-radius:6px}\n    a.btn{display:inline-block;text-decoration:none;background:var(--blue);color:#fff;padding:10px 14px;border-radius:12px;font-weight:700;margin-right:8px}\n    a.btn.alt{background:var(--green)}\n  <\/style><div class='doc-wrap' data-doc-title='🧭 Medical workflow'>\n<div class=\"wrap\">\n  <div class=\"card\">\n    <h1>🧭 Medical workflow — Anamneza → Zdravstveni Karton → LAB Bridge<\/h1>\n    <p class=\"muted\">v16.0.0.79 • senior-friendly tok rada za stvarni zdravstveni dosije<\/p>\n    <p><span class=\"badge\">PRIORITET<\/span><span class=\"badge\">WORKFLOW<\/span><span class=\"badge\">ANAMNEZA/KARTON/LAB<\/span><\/p>\n    <p>Ovaj vodič rešava najvažniju zabunu: <b>šta ide u koji modul i kojim redom<\/b>. Pravilo rada je sada jasno:<\/p>\n    <div class=\"step\"><b>1) Anamneza<\/b> = istorijski okvir slučaja<\/div>\n    <div class=\"step\"><b>2) Zdravstveni Karton<\/b> = vremenska linija, terapije, događaji, prilozi i snapshot-i<\/div>\n    <div class=\"step\"><b>3) LAB Bridge<\/b> = unos novog laboratorijskog nalaza i pravljenje Lab Snapshot-a<\/div>\n  <\/div>\n\n  <div class=\"grid two\">\n    <div class=\"card\">\n      <h2>1) Anamneza — šta ovde pripada<\/h2>\n      <ul>\n        <li>osnovna istorija bolesti i tegoba<\/li>\n        <li>važni datumi, period korone, operacije, hospitalizacije<\/li>\n        <li>porodična anamneza<\/li>\n        <li>alergije, ranije terapije, glavne dijagnoze i sumnje<\/li>\n        <li>kratak odgovor na pitanje: <b>kako je korisnik došao do sadašnjeg stanja<\/b><\/li>\n      <\/ul>\n      <p><b>Ne koristi Anamnezu<\/b> kao tabelu svih laboratorija. Ona je istorijski i lični okvir.<\/p>\n    <\/div>\n    <div class=\"card\">\n      <h2>2) Zdravstveni Karton — šta ovde pripada<\/h2>\n      <ul>\n        <li>medicinski događaji i kontrole<\/li>\n        <li>terapije i promene terapije<\/li>\n        <li>Lab Snapshot-i uvezeni iz LAB Bridge modula<\/li>\n        <li>prilozi, specijalistički sažeci i compare/trend pregled<\/li>\n        <li>pregled stanja po vremenu i po oblasti<\/li>\n      <\/ul>\n      <p><b>Karton je centar sistema<\/b>: spaja aktivnu Anamnezu sa novim laboratorijama.<\/p>\n    <\/div>\n  <\/div>\n\n  <div class=\"card\">\n    <h2>3) LAB Bridge — šta ovde pripada<\/h2>\n    <ul>\n      <li>novi laboratorijski nalaz<\/li>\n      <li>sirovi tekst, prilog ili prepis parametara<\/li>\n      <li>kontekst nalaza: simptomi, anamneza, terapija, cilj<\/li>\n      <li>AI JSON rezultat i Book/Pro izveštaj<\/li>\n      <li>Lab Snapshot koji se zatim uvozi u Karton<\/li>\n    <\/ul>\n    <p><b>LAB Bridge nije zamena za Anamnezu<\/b>. On služi da novi nalaz dobije kontekst i da kasnije uđe u vremensku liniju Kartona.<\/p>\n  <\/div>\n\n  <div class=\"card\">\n    <h2>Praktičan radni tok<\/h2>\n    <ol>\n      <li>U <b>Anamnezi<\/b> označi ili sačuvaj <b>aktivni profil<\/b>.<\/li>\n      <li>U <b>Zdravstvenom Kartonu<\/b> uvezi aktivnu Anamnezu.<\/li>\n      <li>Kada stigne nov nalaz, otvori <b>LAB Bridge<\/b>.<\/li>\n      <li>Klikni <b>Uvezi aktivnu Anamnezu<\/b> da se kontekst popuni brže.<\/li>\n      <li>Unesi nalaz, napravi JSON/Book-Pro izveštaj i sačuvaj <b>Lab Snapshot<\/b>.<\/li>\n      <li>U Kartonu klikni <b>Uvezi poslednji Lab Snapshot<\/b>.<\/li>\n      <li>Po potrebi dodaj događaj, terapijski zapis ili prilog.<\/li>\n    <\/ol>\n  <\/div>\n\n  <div class=\"grid two\">\n    <div class=\"card\">\n      <h2>Kada dopunjavaš Anamnezu?<\/h2>\n      <p>Kada novi pregled ili nalaz menja širu sliku slučaja: nova dijagnoza, nova dugotrajna terapija, važan istorijski događaj ili nova glavna tegoba.<\/p>\n    <\/div>\n    <div class=\"card\">\n      <h2>Kada dopunjavaš Karton?<\/h2>\n      <p>Kada imaš novu kontrolu, specijalistički izveštaj, laboratoriju, terapijsku promenu ili želiš da vidiš trend i vremensku liniju.<\/p>\n    <\/div>\n  <\/div>\n\n  <div class=\"card\">\n    <h2>Najkraći odgovor<\/h2>\n    <ul>\n      <li><b>Anamneza<\/b> = ko je korisnik kao zdravstveni slučaj<\/li>\n      <li><b>Karton<\/b> = kako izgleda vremenska linija i trenutno stanje<\/li>\n      <li><b>LAB Bridge<\/b> = gde unosiš novi nalaz i praviš Snapshot<\/li>\n    <\/ul>\n    <p>\n      <a class=\"btn\" href=\"02_ANAMNEZA_STEP_BY_STEP_v1.0_SR.html\">🩺 Anamneza Step-by-Step<\/a>\n      <a class=\"btn alt\" href=\"35_ZDRAVSTVENI_KARTON_STEP_BY_STEP_v1.0_SR.html\">🗂 Karton Step-by-Step<\/a>\n      <a class=\"btn\" href=\"34_LAB_BRIDGE_STEP_BY_STEP_v1.0_SR.html\">🧪 LAB Step-by-Step<\/a>\n    <\/p>\n  <\/div>\n<\/div>\n<\/div>"}, "docs/protokoli/41_SEARCH_STEP_BY_STEP_v1.0_SR.html": {"title": "🔎 Search step-by-step", "html": "<style>\n    body{font-family:Arial,sans-serif;max-width:980px;margin:0 auto;padding:24px;line-height:1.6;background:#fafafa;color:#222}\n    h1,h2{color:#123c66} .card{background:#fff;border:1px solid #e7e7e7;border-radius:14px;padding:16px 18px;margin:14px 0}\n    .tip{background:#eef6ff;border-color:#b7d4ff}.warn{background:#fff8e8;border-color:#f1d7a2}\n    code{background:#f1f5f9;padding:2px 6px;border-radius:6px}\n  <\/style><div class='doc-wrap' data-doc-title='🔎 Search step-by-step'>\n  <h1>🔎 Search Step-by-Step<\/h1>\n  <div class=\"card tip\"><b>Šta je ovo:<\/b> vodič za brzu i mirnu pretragu kataloga, posebno za opšte pojmove kao što su <b>bolovi<\/b>, <b>reuma<\/b>, <b>štitna<\/b>, <b>stomak<\/b> i <b>koža<\/b>.<\/div>\n  <div class=\"card\">\n    <h2>1. Kako sada radi pretraga<\/h2>\n    <ul>\n      <li>traži kroz <b>naziv<\/b>, <b>opis<\/b>, <b>MKB-10<\/b>, <b>ključne reči<\/b> i <b>oblast<\/b><\/li>\n      <li>prepoznaje i šire pojmove i narodne nazive<\/li>\n      <li>odvaja <b>glavne rezultate<\/b> od <b>povezanih<\/b><\/li>\n      <li>prikazuje poruku kada ima još rezultata ispod ekrana<\/li>\n    <\/ul>\n  <\/div>\n  <div class=\"card\">\n    <h2>2. Najlakši tok rada<\/h2>\n    <ol>\n      <li>Otvori <b>Katalog<\/b>.<\/li>\n      <li>U polje pretrage upiši pojam, npr. <code>reuma<\/code>.<\/li>\n      <li>Pritisni <b>Enter<\/b> ili dugme <b>🔎 Traži<\/b>.<\/li>\n      <li>Pogledaj plavu status poruku iznad rezultata.<\/li>\n      <li>Otvori karticu simptoma koja najbolje odgovara problemu.<\/li>\n    <\/ol>\n  <\/div>\n  <div class=\"card warn\">\n    <h2>3. Ako nema rezultata<\/h2>\n    <p>Probaj širi pojam ili varijantu bez dijakritike:<\/p>\n    <ul>\n      <li><code>stitna<\/code> umesto <code>štitna<\/code><\/li>\n      <li><code>bolovi<\/code> umesto previše uskog naziva<\/li>\n      <li><code>stomak<\/code>, <code>koža<\/code>, <code>disanje<\/code> kao početne oblasti<\/li>\n    <\/ul>\n  <\/div>\n  <div class=\"card\">\n    <h2>4. Kako čitati rezultate<\/h2>\n    <ul>\n      <li><b>🎯 Glavni rezultat<\/b> znači da postoji jako poklapanje u nazivu, ključnim rečima ili MKB opisu.<\/li>\n      <li><b>🔎 Povezano<\/b> znači da je stavka srodna i može biti korisna čak i ako nije potpuno ista formulacija.<\/li>\n      <li>Ako status kaže da ima još rezultata, <b>skroluj nadole<\/b>.<\/li>\n    <\/ul>\n  <\/div>\n<\/div>"}, "docs/control-center/SINET_Control_Center_v1.html": {"title": "🧰 Control Center dokumentacija", "html": "<style>\n    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;line-height:1.6;margin:0;background:#f5f8fc;color:#1f2937}\n    .wrap{max-width:980px;margin:0 auto;padding:18px}\n    .card{background:#fff;border-radius:16px;padding:18px;margin:0 0 16px;box-shadow:0 4px 18px rgba(15,23,42,.08)}\n    h1,h2,h3{margin:.2em 0 .5em;color:#0f3d66} code,pre{background:#eef4fb;border-radius:10px} code{padding:.15em .4em} pre{padding:12px;overflow:auto}\n    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.btn{display:inline-block;text-decoration:none;background:#2563eb;color:#fff;padding:12px 14px;border-radius:12px;font-weight:700}\n    .btn.secondary{background:#0f766e}.btn.dark{background:#334155}.muted{color:#5b6472}\n    ul{padding-left:18px}\n  <\/style><div class='doc-wrap' data-doc-title='🧰 Control Center dokumentacija'>\n  <div class=\"wrap\">\n    <div class=\"card\">\n      <h1>🎛 SINET Control Center v1<\/h1>\n      <p><b>Control Center je spoljašnji alat<\/b>, zamišljen da bude <b>van Audio Lekar aplikacije<\/b>. Njegov posao nije terapijski UI, nego administracija projekta: <b>instalacija za korisnika<\/b>, desktop launcher, lokalni start, backup, GitHub/Netlify i centralni panel za više projekata.<\/p>\n      <div class=\"grid\">\n        <a class=\"btn\" href=\"../../tools/control-center/README_SINET_CONTROL_CENTER_v1.md\">📄 README<\/a>\n        <a class=\"btn secondary\" href=\"../../tools/control-center/install_sinet_control_center.sh\">🛠 install_sinet_control_center.sh<\/a>\n        <a class=\"btn dark\" href=\"../../tools/control-center/projects.json\">🧩 projects.json<\/a>\n      <\/div>\n    <\/div>\n    <div class=\"card\">\n      <h2>Šta dobijaš<\/h2>\n      <ul>\n        <li><b>Centralni meni za više projekata<\/b> — SINET Audio Lekar + Paprikas Hub.<\/li>\n        <li><b>Install / launcher<\/b> — desktop ikona i brzi start na Manjaru.<\/li>\n        <li><b>Project config<\/b> preko <code>projects.json<\/code>.<\/li>\n        <li><b>Backup<\/b>, <b>Git init/publish<\/b>, otvaranje GitHub i Netlify linkova.<\/li>\n      <\/ul>\n      <p class=\"muted\">Ovo je administrativni sloj i zato je namerno odvojen od glavnog Audio Lekar UI-a.<\/p>\n    <\/div>\n    <div class=\"card\">\n      <h2>Brza instalacija na Manjaru<\/h2>\n      <ol>\n        <li>Raspakuj projekat.<\/li>\n        <li>Otvori folder <code>tools/control-center/<\/code>.<\/li>\n        <li>Pokreni:<\/li>\n      <\/ol>\n      <pre>chmod +x tools/control-center/*.sh\nchmod +x tools/control-center/*.desktop\n./tools/control-center/install_sinet_control_center.sh<\/pre>\n      <p>Skripta pravi folder <code>~/Desktop/SINET_Control_Center<\/code> i kopira potrebne fajlove za rad.<\/p>\n    <\/div>\n    <div class=\"card\">\n      <h2>Fajlovi<\/h2>\n      <ul>\n        <li><code>sinet_control_center_manjaro.sh<\/code> — glavni panel<\/li>\n        <li><code>sinet_control_center.desktop<\/code> — desktop launcher<\/li>\n        <li><code>install_sinet_control_center.sh<\/code> — brza instalacija<\/li>\n        <li><code>projects.json<\/code> — konfiguracija projekata<\/li>\n        <li><code>*github*_manjaro.sh<\/code> — legacy GitHub skripte<\/li>\n      <\/ul>\n    <\/div>\n  <\/div>\n<\/div>"}, "docs/control-center/SINET_One_Click_Install_v2.html": {"title": "⚙️ One-click install", "html": "<style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;line-height:1.65;margin:0;background:#f4f8fd;color:#1f2937}.wrap{max-width:980px;margin:0 auto;padding:18px}.card{background:#fff;border-radius:18px;padding:18px;margin:0 0 16px;box-shadow:0 8px 24px rgba(15,23,42,.08)}h1,h2,h3{margin:.2em 0 .5em;color:#0f3d66}.hero{background:linear-gradient(135deg,#eff6ff,#ecfeff);border:1px solid #bfdbfe}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.pill{display:inline-block;border-radius:999px;padding:6px 10px;background:#e0f2fe;color:#0c4a6e;font-weight:800;margin:0 8px 8px 0}.note{background:#fff8e1;border-left:4px solid #f59e0b;padding:12px;border-radius:10px;color:#7c4a03}ol,ul{padding-left:20px}<\/style><div class='doc-wrap' data-doc-title='⚙️ One-click install'><div class=\"wrap\"><div class=\"card hero\"><h1>⬇️ Instalacija za korisnika — <b>1 klik<\/b><\/h1><p>Krajnji korisnik <b>ne treba<\/b> da razmišlja o terminalu, komandama, chmod koracima ili putanjama.<\/p><div><span class=\"pill\">1 dugme<\/span><span class=\"pill\">automatska instalacija<\/span><span class=\"pill\">desktop prečica<\/span><span class=\"pill\">lokalni start<\/span><span class=\"pill\">bez CMD koraka<\/span><\/div><\/div><div class=\"card\"><h2>Kako izgleda korisnički tok<\/h2><ol><li>Raspakuje ZIP paket.<\/li><li>Dvoklikne na <b>INSTALL SINET Audio Lekar<\/b>.<\/li><li>Skripta sama instalira aplikaciju, pravi prečice, dodaje Safe Mode i otvara aplikaciju.<\/li><\/ol><\/div><div class=\"card\"><h2>Zašto postoji Safe Mode<\/h2><ul><li>meni se ne otvara,<\/li><li>brzi linkovi nisu potpuni,<\/li><li>stara verzija i dalje iskače iako je ZIP zamenjen.<\/li><\/ul><div class=\"note\">Safe Mode otvara <b>index-nosw.html<\/b> i služi za brz oporavak bez tehničke intervencije.<\/div><\/div><div class=\"card\"><h2>Administrativni i korisnički sloj<\/h2><ul><li><b>Korisnik<\/b>: jedno dugme <b>INSTALL SINET Audio Lekar<\/b>.<\/li><li><b>Admin<\/b>: po potrebi koristi <b>SINET Control Center<\/b>.<\/li><\/ul><\/div><\/div><\/div>"}, "tools/control-center/README_SINET_CONTROL_CENTER_v1.md": {"title": "📄 README / putanje", "html": "<div class='doc-wrap'><h1>📄 README / putanje<\/h1><h1>README — SINET Control Center v1<\/h1><p>Ovaj fajl postoji kao kompatibilni Help ulaz za Control Center dokumentaciju.<\/p><h2>Glavni dokumenti<\/h2><ul><li>`../../docs/protokoli/37_SINET_CONTROL_CENTER_INSTALL_v1.0_SR.html`<\/li><li>`../../docs/control-center/SINET_Control_Center_v1.html`<\/li><li>`../../docs/control-center/SINET_One_Click_Install_v2.html`<\/li><\/ul><h2>Svrha<\/h2><p>Control Center je spoljašnji panel za lokalni rad sa SINET projektima:<\/p><ul><li>status<\/li><li>lokalni start<\/li><li>backup<\/li><li>install tok<\/li><li>GitHub / Netlify pomoćne korake<\/li><\/ul><h2>Napomena<\/h2><p>Za Audio Lekar je u v16.0.0.77 fokus na tome da Help putanje rade pouzdano i da korisnik uvek može da dođe do dokumentacije bez 404 ekrana.<\/p><\/div>"}}</script>

<script>
(function(){
  const DOCS = JSON.parse(document.getElementById('docs-data').textContent);
  const ALIASES = JSON.parse(document.getElementById('docs-aliases').textContent);
  const SECTIONS = JSON.parse(document.getElementById('docs-sections').textContent);
  const side = document.getElementById('side');
  const content = document.getElementById('content');
  const searchInput = document.getElementById('searchInput');
  const bundleBase = 'SINET_Audio_Lekar_DOCS_SUPPORT/docs/SINET_HELP_BUNDLE_v16.0.0.81.9.html';

  function normalizePath(raw, current){
    raw = String(raw || '').trim();
    if (!raw) return '__INDEX__';
    if (raw.startsWith('#')) return '__INDEX__';
    raw = raw.replace(/^\.\//,'');
    raw = raw.replace(/^\/+/,'');
    raw = raw.replace(/^SINET_Audio_Lekar_DOCS_SUPPORT\//,'');
    if (ALIASES[raw]) return ALIASES[raw];
    if (/^(https?:|mailto:|tel:|data:|blob:)/i.test(raw)) return raw;
    const base = current && current.includes('/') ? current.replace(/[^/]+$/, '') : '';
    const stack = base ? base.split('/').filter(Boolean) : [];
    for (const part of raw.split('/')) {
      if (!part || part === '.') continue;
      if (part === '..') { if (stack.length) stack.pop(); continue; }
      stack.push(part);
    }
    const joined = stack.join('/');
    return ALIASES[joined] || joined;
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  function renderIndex(){
    const topCards = [
      ['SINET_User_Manual_v1.1_SR_v16.0.0.81.html','📘 Korisničko uputstvo','Mirno, korak po korak vodič za rad u aplikaciji.'],
      ['docs/protokoli/00_DECISION_TREE_i_POJMOVI_v1.0_SR.html','🧭 Mini decision tree','Brza orijentacija: šta prvo otvoriti i kojim redom.'],
      ['docs/protokoli/00_MASTER_STEP_BY_STEP_v1.0_SR.html','📘 Master Step-by-Step','Kompletan tok rada, od queue do protokola i dokumenata.'],
      ['docs/protokoli/09_QUICK_START_3_KLIKA_v1.0_SR.html','🚀 Quick Start','Najkraći ulaz za reprodukciju i osnovni rad.'],
      ['docs/protokoli/40_MEDICAL_WORKFLOW_ANAMNEZA_KARTON_LAB_v1.0_SR.html','🧭 Medical workflow','Veza Anamneza → Karton → LAB.'],
      ['docs/protokoli/41_SEARCH_STEP_BY_STEP_v1.0_SR.html','🔎 Search Step-by-Step','Kako da pretraga radi smisleno i brzo.'],
      ['docs/protokoli/37_SINET_CONTROL_CENTER_INSTALL_v1.0_SR.html','🎛 Control Center + Install','Instalacija i admin radnje na jednom mestu.']
    ];
    content.innerHTML = `<div class="note">✅ Ovaj bundle je napravljen da radi stabilno u iframe-u na Netlify/GitHub deploy-u. Dokumenti su ugrađeni interno, bez spoljnog učitavanja pojedinačnih HTML fajlova.</div>
      <div class="cards">${topCards.map(([path,title,desc]) => `<div class="card"><h3>${title}</h3><p>${desc}</p><a class="btn" href="#doc=${encodeURIComponent(path)}">Otvori</a></div>`).join('')}</div>`;
    setActive('__INDEX__');
    document.title = 'SINET Help Bundle';
  }

  function setActive(key){
    side.querySelectorAll('.navlink').forEach(a => a.classList.toggle('active', a.getAttribute('data-key') === key));
  }

  function buildSidebar(){
    let html = `<div class="section-title">Brzi ulaz</div><div class="navlist"><a class="navlink" data-key="__INDEX__" href="#index">📚 Indeks<small>Početna stranica bundle-a</small></a></div>`;
    for (const [group, keys] of SECTIONS) {
      html += `<div class="section-title">${escapeHtml(group)}</div><div class="navlist">`;
      for (const key of keys) {
        const meta = DOCS[key];
        if (!meta) continue;
        html += `<a class="navlink" data-key="${escapeHtml(key)}" href="#doc=${encodeURIComponent(key)}">${escapeHtml(meta.title)}<small>${escapeHtml(key)}</small></a>`;
      }
      html += `</div>`;
    }
    side.innerHTML = html;
  }

  function renderDoc(key){
    const meta = DOCS[key];
    if (!meta) {
      content.innerHTML = `<div class="note">Dokument nije uključen u clean bundle: <b>${escapeHtml(key)}</b><br>Vrati se na <a href="#index">indeks</a>.</div>`;
      setActive('');
      return;
    }
    content.innerHTML = `<div class="meta">Otvoren dokument: <code>${escapeHtml(key)}</code></div>` + meta.html;
    setActive(key);
    document.title = meta.title + ' — SINET Help Bundle';
    content.scrollTop = 0;
    window.scrollTo({top:0, behavior:'instant'});
  }

  function route(){
    const hash = decodeURIComponent(location.hash || '#index');
    if (!hash || hash === '#index') return renderIndex();
    if (hash.startsWith('#doc=')) {
      const raw = hash.slice(5);
      const key = normalizePath(raw);
      if (key === '__INDEX__') return renderIndex();
      return renderDoc(key);
    }
    renderIndex();
  }

  side.addEventListener('click', function(e){
    const a = e.target.closest('a[href]');
    if (!a) return;
  });

  content.addEventListener('click', function(e){
    const a = e.target.closest('a[href]');
    if (!a) return;
    const href = a.getAttribute('href');
    if (!href) return;
    if (/^(https?:|mailto:|tel:|data:|blob:)/i.test(href)) return;
    e.preventDefault();
    const current = decodeURIComponent((location.hash || '#doc=').replace(/^#doc=/,''));
    const key = normalizePath(href, current);
    if (key === '__INDEX__') { location.hash = '#index'; return; }
    if (DOCS[key]) { location.hash = '#doc=' + encodeURIComponent(key); return; }
    location.hash = '#index';
  });

  document.getElementById('backBtn').addEventListener('click', function(){
    if (history.length > 1) history.back(); else location.hash = '#index';
  });
  document.getElementById('topBtn').addEventListener('click', function(){
    window.scrollTo({top:0, behavior:'smooth'}); content.scrollTop = 0;
  });
  document.getElementById('printBtn').addEventListener('click', function(){ window.print(); });
  document.getElementById('findBtn').addEventListener('click', function(){
    const q = (searchInput.value || '').trim();
    if (!q) return;
    try { window.find(q, false, false, true, false, false, false); } catch(_) {}
  });
  searchInput.addEventListener('keydown', function(e){ if (e.key === 'Enter') document.getElementById('findBtn').click(); });

  buildSidebar();
  window.addEventListener('hashchange', route);
  route();
  try { window.SINET_HELP_BUNDLE_READY = true; window.SINET_HELP_BUNDLE_VERSION = '16.0.0.81.9'; } catch(_) {}
})();
</script>
