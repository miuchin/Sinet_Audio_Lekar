<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>LAB / BookPro Report · v16.0.0.118.40.23</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/sinet-quickbar.css?v=v16.0.0.118.40.23">
  <link rel="stylesheet" href="css/sinet-medical-runtime.css?v=v16.0.0.118.40.23">
  <script defer src="js/sinet-page-nav.js?v=v16.0.0.118.40.23"></script>
  <script defer src="js/db/indexed-db.js"></script>
  <script defer src="js/core/bridge-runtime.js?v=v16.0.0.118.40.23"></script>
  <script defer src="js/core/id-service.js?v=v16.0.0.118.40.23"></script>
  <script defer src="js/renderers/lab-bookpro-renderer.js?v=v16.0.0.118.40.23"></script>
  <script defer src="js/core/runtime-store.js?v=v16.0.0.118.40.23"></script>
  <script defer src="js/core/audit-service.js?v=v16.0.0.118.40.23"></script>
</head>
<body class="sinet-medical-page">
<div class="sinet-shell">
  <div class="sinet-page-hero">
    <h1>📘 LAB / BookPro report viewer</h1>
    <p>Pregled Full i Doctor view izveštaja sa export i print akcijama.</p>
    <span class="sinet-version-badge">v16.0.0.118.40.23</span>
  </div>

  <div class="sinet-card mb-3" id="report-meta">Učitavanje reporta…</div>

  <div class="sinet-card mb-3">
    <div class="sinet-actions">
      <button class="sinet-btn green" id="btn-view-full">📘 Full view</button>
      <button class="sinet-btn secondary" id="btn-view-doctor">🩺 Doctor view</button>
      <button class="sinet-btn secondary" id="btn-open-raw">🌐 Otvori raw HTML</button>
      <button class="sinet-btn secondary" id="btn-download-md">📝 MD</button>
      <button class="sinet-btn secondary" id="btn-download-txt">📄 TXT</button>
      <button class="sinet-btn secondary" id="btn-download-json">🧩 JSON</button>
      <button class="sinet-btn secondary" id="btn-link-anam">🔗 Anamneza</button>
      <button class="sinet-btn secondary" id="btn-print-report">🖨 Print</button>
    </div>
  </div>

  <div class="sinet-card">
    <iframe id="report-frame" title="LAB / BookPro report" style="width:100%;min-height:78vh;border:1px solid #dbe9f6;border-radius:14px;background:#fff;"></iframe>
  </div>
</div>
<script>
  const store = new window.SinetMedicalRuntimeStore();
  const audit = new window.SinetAuditService(store);
  let activeReport = null;
  let activeView = 'full';
  function esc(v){ return String(v == null ? '' : v).replace(/[&<>"]/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[s])); }
  function downloadText(filename, content, mime){
    const blob = new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  }
  function renderFrame(){
    const frame = document.getElementById('report-frame');
    frame.srcdoc = activeView === 'doctor' ? (activeReport.html_doctor_inline || activeReport.html_full_inline || '<html><body><p>Nema HTML sadržaja.</p></body></html>') : (activeReport.html_full_inline || '<html><body><p>Nema HTML sadržaja.</p></body></html>');
  }
  async function init(){
    await store.ensureBootstrap();
    const qs = new URLSearchParams(location.search);
    const reportId = qs.get('report_id');
    activeView = qs.get('view') === 'doctor' ? 'doctor' : 'full';
    if (!reportId) {
      document.getElementById('report-meta').innerHTML = '<div class="sinet-empty">Nedostaje report_id.</div>';
      return;
    }
    activeReport = await store.getReportById(reportId);
    if (!activeReport) {
      document.getElementById('report-meta').innerHTML = '<div class="sinet-empty">Report nije pronađen.</div>';
      return;
    }
    await audit.log('lab_bookpro','report_view_opened','generated_report',reportId,{viewer:'lab_bookpro_report.html', view:activeView});
    document.getElementById('report-meta').innerHTML = `
      <div class="sinet-kv">
        <div>Report ID</div><div><strong>${esc(activeReport.report_id)}</strong></div>
        <div>Dokument ID</div><div>${esc(activeReport.document_id)}</div>
        <div>Status</div><div><span class="sinet-pill ok">${esc(activeReport.status || 'ready')}</span></div>
        <div>Sažetak</div><div>${esc(activeReport.summary_clinical || '')}</div>
      </div>`;
    renderFrame();
  }
  document.getElementById('btn-view-full').addEventListener('click', () => { activeView = 'full'; renderFrame(); });
  document.getElementById('btn-view-doctor').addEventListener('click', () => { activeView = 'doctor'; renderFrame(); });
  document.getElementById('btn-open-raw').addEventListener('click', () => {
    if (!activeReport) return;
    const raw = activeView === 'doctor' ? (activeReport.html_doctor_url || activeReport.html_doctor_path) : (activeReport.html_full_url || activeReport.html_full_path);
    if (raw) window.open(raw, '_blank', 'noopener');
  });
  document.getElementById('btn-download-md').addEventListener('click', () => {
    if (!activeReport) return;
    downloadText(`${activeReport.report_id}.md`, activeReport.md_inline || '', 'text/markdown;charset=utf-8');
  });
  document.getElementById('btn-download-txt').addEventListener('click', () => {
    if (!activeReport) return;
    downloadText(`${activeReport.report_id}.txt`, activeReport.txt_inline || '', 'text/plain;charset=utf-8');
  });
  document.getElementById('btn-download-json').addEventListener('click', () => {
    if (!activeReport) return;
    downloadText(`${activeReport.report_id}.json`, JSON.stringify(activeReport.json_inline || {}, null, 2), 'application/json;charset=utf-8');
  });
  document.getElementById('btn-link-anam').addEventListener('click', () => {
    if (!activeReport) return;
    location.href = `anamneza_runtime.html?document_id=${encodeURIComponent(activeReport.document_id || '')}&report_id=${encodeURIComponent(activeReport.report_id || '')}`;
  });
  document.getElementById('btn-print-report').addEventListener('click', () => {
    const frame = document.getElementById('report-frame');
    frame.contentWindow && frame.contentWindow.print && frame.contentWindow.print();
  });
  init();
</script>
</body>
</html>
