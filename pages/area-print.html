<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SINET Oblasti • Print / Export v16.0.0.118.40.10</title>
  <style>
    :root{--bg:#f7fbff;--line:#d9e7f5;--ink:#14324a;--muted:#5f7288}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:100}
    .actions{display:flex;gap:8px;flex-wrap:wrap}
    button,a.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;cursor:pointer;text-decoration:none;color:var(--ink);font-weight:700}
    #app.empty{padding:24px;margin:14px;max-width:1560px;border:1px dashed var(--line);border-radius:14px;background:#fff;color:var(--muted)}
    @media print{.topbar{display:none} #app.empty{border:none;margin:0;padding:0;background:#fff}}
  </style>
</head>
<body>
<div class="topbar">
  <div>
    <div id="pageTitle" style="font-weight:800;">SINET Oblasti • Print / Export</div>
    <div id="pageMeta" style="color:var(--muted);">v16.0.0.118.40.10</div>
  </div>
  <div class="actions">
    <a class="btn" href="../index.html?v=16.0.0.118.40.10">🏠 Početna</a>
    <button onclick="history.back()">⬅️ Nazad</button>
    <button onclick="exportAreaHtml()">⬇ HTML</button>
    <button onclick="exportAreaTxt()">⬇ TXT</button>
    <button onclick="exportAreaMd()">⬇ MD</button>
    <button onclick="window.print()">🖨️ Štampaj</button>
  </div>
</div>
<div id="app" class="empty">Učitavam pregled oblasti…</div>
<script src="../js/sinet-area-export.js?v=16.0.0.118.40.10"></script>
<script>
const VERSION = '16.0.0.118.40.10';
const params = new URLSearchParams(location.search);
const mode = params.get('mode') || 'areas';
const oblast = params.get('oblast') || '';
(async()=>{
  try {
    window.__sinetAreaPayload = await window.SINET_AreaExport.renderPage({ host: document.getElementById('app'), mode, oblast, catalogPath:'../data/SINET_CATALOG.json' });
    const title = window.__sinetAreaPayload?.title || 'SINET Oblasti';
    const modeLabel = mode === 'areas' ? '3 kolone • zbijen pregled' : 'svaka oblast nova strana • simptomi u 2 kolone';
    document.getElementById('pageTitle').textContent = `${title} • Print / Export`;
    document.getElementById('pageMeta').textContent = `v${VERSION} • ${modeLabel}`;
    document.title = `${title} • Print / Export v${VERSION}`;
  } catch(e) {
    document.getElementById('app').innerHTML = `<div class="empty">Greška pri učitavanju: ${String(e?.message || e)}</div>`;
  }
})();
function exportAreaHtml(){ const p = window.__sinetAreaPayload || window.SINET_AreaExport.loadPersisted(); if (p?.items?.length) window.SINET_AreaExport.exportHTML(p.items, p); }
function exportAreaTxt(){ const p = window.__sinetAreaPayload || window.SINET_AreaExport.loadPersisted(); if (p?.items?.length) window.SINET_AreaExport.exportTXT(p.items, p); }
function exportAreaMd(){ const p = window.__sinetAreaPayload || window.SINET_AreaExport.loadPersisted(); if (p?.items?.length) window.SINET_AreaExport.exportMD(p.items, p); }
</script>
</body>
</html>
