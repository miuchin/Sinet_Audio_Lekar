<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SINET Print kartica simptoma v16.0.0.118.40.10</title>
  <style>
    :root{--bg:#f7fbff;--card:#ffffff;--line:#d9e7f5;--ink:#14324a;--muted:#5f7288;--soft:#eef6ff;--soft2:#f8fbff;--ok:#edf8f0;--warn:#fff7e8}
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
    .topbar{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
    .brand{font-weight:800} .muted{color:var(--muted)} .actions{display:flex;gap:8px;flex-wrap:wrap}
    button,a.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;cursor:pointer;text-decoration:none;color:var(--ink);font-weight:700}
    .page{padding:14px;max-width:1560px;margin:0 auto} .sheet{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 6px 24px rgba(20,50,74,.08)}
    #app .header{display:grid;grid-template-columns:1.35fr 1fr;gap:12px;margin-bottom:12px} #app .title{font-size:29px;line-height:1.08;font-weight:800;margin:0 0 6px 0}
    #app .header-note{font-size:13px;line-height:1.35;color:var(--muted)}
    #app .meta-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px} #app .meta-chip{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:9px 11px}
    #app .label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px;font-weight:700} #app .value{font-size:13px;font-weight:700;line-height:1.25}
    #app .print-flow{display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);gap:12px;align-items:start}
    #app .stack{display:grid;gap:12px;align-content:start} #app .stack.compact-stack{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px} #app .stack.compact-stack .block.full{grid-column:1 / -1}
    #app .block{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px;margin:0;break-inside:avoid;page-break-inside:avoid} #app .block h3{margin:0 0 7px 0;font-size:15px}
    #app .list{display:grid;gap:7px} #app .item{padding:7px 9px;border:1px solid var(--line);border-radius:12px;background:var(--soft2);break-inside:avoid;page-break-inside:avoid}
    #app .mini-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px} #app .hz{font-weight:800} #app .small{font-size:11px;color:var(--muted);line-height:1.24} #app .compact-text{line-height:1.34;font-size:13px}
    #app .badge{display:inline-block;padding:4px 8px;border-radius:999px;border:1px solid var(--line);background:var(--soft);font-size:11px;font-weight:700;margin:0 6px 6px 0}
    #app .empty{color:var(--muted);font-style:italic} #app .highlight{background:var(--soft)} #app .ok{background:var(--ok)} #app .warn{background:var(--warn)}
    @media (max-width:1120px){#app .header,#app .print-flow,#app .stack.compact-stack,#app .meta-grid,#app .mini-grid{grid-template-columns:1fr}#app .title{font-size:24px}}
    @page{size:A4 landscape;margin:7mm}
    @media print{
      body{background:#fff;font-size:8.4pt;color:#1d2d3a}
      .topbar{display:none}
      .page{padding:0;max-width:none}
      .sheet{border:none;box-shadow:none;border-radius:0;padding:0}
      #app .header{grid-template-columns:1.18fr 1fr;gap:3.6mm;margin-bottom:3.6mm}
      #app .title{font-size:15.5pt;margin-bottom:1.2mm}
      #app .header-note{font-size:7.4pt;line-height:1.14}
      #app .meta-grid{gap:1.3mm}
      #app .meta-chip{padding:1.7mm 2mm;border-radius:7px}
      #app .label{font-size:6.7pt;margin-bottom:.6mm}
      #app .value{font-size:7.5pt;line-height:1.12}
      #app .print-flow{display:block;column-count:2;column-gap:4.7mm;column-fill:auto}
      #app .stack{display:contents}
      #app .stack.compact-stack{display:contents}
      #app .block{display:inline-block;width:100%;padding:1.8mm 2.1mm;margin:0 0 2mm;border-radius:7px;border:1px solid #bcd1e4}
      #app .block h3{font-size:8.3pt;margin:0 0 1mm}
      #app .list{display:block}
      #app .item{padding:1.4mm 1.6mm;border-radius:6px;margin:0 0 1.2mm}
      #app .mini-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.2mm}
      #app .small{font-size:6.6pt;line-height:1.12}
      #app .compact-text{font-size:7pt;line-height:1.14}
      #app .badge{font-size:6.8pt;padding:.8mm 1.4mm;margin:0 .7mm .7mm 0}
      a{color:inherit;text-decoration:none}
    }
  </style>
</head>
<body>
<div class="topbar"><div><div class="brand">SINET Print kartica simptoma</div><div class="muted">v16.0.0.118.40.10 • A4 landscape • gusti raspored • 2 kolone</div></div><div class="actions"><a class="btn" href="../index.html?v=16.0.0.118.40.10">🏠 Početna</a><button onclick="history.back()">⬅️ Nazad</button><button onclick="exportPrintCardHtml()">⬇ HTML</button><button onclick="exportPrintCardTxt()">⬇ TXT</button><button onclick="exportPrintCardMd()">⬇ MD</button><button onclick="window.print()">🖨️ Štampaj</button></div></div>
<div class="page"><div id="app" class="sheet"><div class="empty">Učitavam karticu simptoma…</div></div></div>
<script src="../js/sinet-symptom-card.js?v=16.0.0.118.40.10"></script>
<script>
const VERSION='16.0.0.118.40.10';
const app=document.getElementById('app');
const params=new URLSearchParams(location.search);
const itemId=params.get('id')||'';
const autoprint=params.get('autoprint')==='1';
(async()=>{
  try {
    const item = await window.SINET_SymptomCard.renderPage({ host: app, id: itemId, catalogPath: '../data/SINET_CATALOG.json' });
    window.__sinetPrintItem = item || null;
    if (autoprint) setTimeout(() => { try { window.print(); } catch(_) {} }, 220);
  } catch (e) {
    app.innerHTML = `<div class="empty">Greška pri učitavanju kartice: ${String(e?.message || e)}</div>`;
  }
})();
function exportPrintCardHtml(){ const item = window.__sinetPrintItem || window.SINET_SymptomCard.loadPersisted(); if (item) window.SINET_SymptomCard.exportHTML(item); }
function exportPrintCardTxt(){ const item = window.__sinetPrintItem || window.SINET_SymptomCard.loadPersisted(); if (item) window.SINET_SymptomCard.exportTXT(item); }
function exportPrintCardMd(){ const item = window.__sinetPrintItem || window.SINET_SymptomCard.loadPersisted(); if (item) window.SINET_SymptomCard.exportMD(item); }
</script></body></html>
